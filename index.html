<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pontlife</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pontlife">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0b12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
  /* Spelskärm som fyller allt; startruta i stil med en gammal kassettetikett. Ett mörkt utseende oavsett tema. */
  :root {
    --night: #0d0b12;
    --ink: #f7f0e0;
    --muted: #b7ab95;
    --forest: #2f6b3a;
    --gold: #f2c14e;
    --frame: #171f4d;
    --display: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { background: var(--night); color: var(--ink); overflow: hidden; font-family: var(--display); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; image-rendering: pixelated; }
  #safe { position: fixed; visibility: hidden; pointer-events: none; inset: 0;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  #intro {
    position: fixed; inset: 0; display: grid; place-items: center; z-index: 5;
    padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    background:
      radial-gradient(ellipse at 50% 120%, color-mix(in srgb, var(--forest) 55%, transparent), transparent 60%),
      var(--night);
  }
  .card {
    width: min(440px, 100%); display: grid; gap: 18px; text-align: center;
    border: 3px solid var(--ink); outline: 3px solid #140f24; box-shadow: inset 0 0 0 3px #9e9180;
    background: var(--frame); padding: 26px 22px 22px;
  }
  h1 { margin: 0; font-size: clamp(42px, 13vw, 64px); font-weight: 700; letter-spacing: 0.06em; color: var(--gold);
       text-shadow: 3px 3px 0 #5a2a12, 6px 6px 0 rgba(0,0,0,0.45); line-height: 1; text-wrap: balance; }
  .tag { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.35; text-wrap: balance; }
  .hero { display: flex; justify-content: center; gap: 10px; align-items: flex-end; height: 72px; }
  .hero img { height: 72px; image-rendering: pixelated; }
  .hero img.small { height: 48px; }
  button#play {
    font: 700 22px var(--display); letter-spacing: 0.08em; color: #2a1a08; background: var(--gold);
    border: 3px solid var(--ink); padding: 12px 18px; cursor: pointer; box-shadow: 0 5px 0 #8a5a12;
  }
  button#play:active { transform: translateY(3px); box-shadow: 0 2px 0 #8a5a12; }
  button#play:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .controls { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; text-align: left; font-size: 15px; color: var(--ink); margin: 0; }
  .controls dt { color: var(--gold); white-space: nowrap; }
  .controls dd { margin: 0; color: var(--muted); }
  .note { margin: 0; font-size: 13px; color: var(--muted); }
  @media (orientation: portrait) and (max-width: 600px) { .rotate { display: block; } }
  .rotate { display: none; margin: 0; font-size: 14px; color: var(--gold); }
  @media (prefers-reduced-motion: no-preference) { .hero img:first-child { animation: bob 1.2s steps(2) infinite; } }
  @keyframes bob { 50% { transform: translateY(-3px); } }

  /* ---------- intro ---------- */
  #splash { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 4; image-rendering: pixelated; background: #000; }
  #splash[hidden] { display: none; }
  #intro.over-splash { background: transparent; place-items: end center; }
  #intro.over-splash .card { background: rgba(23,31,77,0.88); gap: 12px; padding: 16px 18px; margin-bottom: 4px; }
  #intro.over-splash .card h1, #intro.over-splash .hero, #intro.over-splash .tag, #intro.over-splash .rotate { display: none; }
  #intro.over-splash .controls { font-size: 12px; }
  @media (max-height: 500px) { #intro.over-splash .controls, #intro.over-splash .note { display: none; } }
  .studio { margin: 0; font-size: 12px; color: var(--muted); letter-spacing: 0.08em; }
  /* ---------- menyer ---------- */
  #intro.over-splash { place-items: center; overflow-y: auto; }
  #menuRoot { display: grid; justify-items: center; gap: 10px; width: min(460px, 100%); }
  /* över introt: lämna plats för PONTLIFE-titeln överst */
  #menuRoot.onsplash { margin-top: 30vh; }
  #menuRoot.onsplash .mbox { max-height: 66vh; background: rgba(16, 20, 54, 0.82); }
  @media (max-height: 520px) {
    #menuRoot.onsplash { margin-top: 33vh; width: min(560px, 100%); }
    #menuRoot.onsplash .mbox { max-height: 64vh; }
    #menuRoot.onsplash .mlist { grid-template-columns: 1fr 1fr; column-gap: 6px; }
    #menuRoot.onsplash .mitem small { display: none; }
    #menuRoot.onsplash .mfoot { display: none; }
  }
  .mlogo { width: min(420px, 92%); image-rendering: pixelated; animation: mfloat 3.2s ease-in-out infinite, mfade .5s both; filter: drop-shadow(0 6px 0 rgba(0,0,0,.35)); }
  @media (max-height: 520px) { .mlogo { width: min(300px, 60%); } }
  @keyframes mfloat { 50% { transform: translateY(-4px); } }
  @keyframes mfade { from { opacity: 0; } }
  .mbox { width: 100%; padding: 14px 14px 10px; background: rgba(16, 20, 54, 0.9); border: 3px solid var(--ink); outline: 3px solid #140f24; box-shadow: inset 0 0 0 3px #9e9180, 0 10px 30px rgba(0,0,0,.5);
    max-height: calc(100vh - 40px); overflow-y: auto; }
  .mbox.pop { animation: mpop .32s cubic-bezier(.2,1.4,.4,1) both; }
  .mbox.from-right { animation: mright .26s cubic-bezier(.2,.9,.3,1) both; }
  .mbox.from-left { animation: mleft .26s cubic-bezier(.2,.9,.3,1) both; }
  @keyframes mpop { from { opacity: 0; transform: translateY(18px) scale(.94); } }
  @keyframes mright { from { opacity: 0; transform: translateX(40px); } }
  @keyframes mleft { from { opacity: 0; transform: translateX(-40px); } }
  .mtitle { margin: 2px 6px 8px; font: 700 20px var(--display); color: var(--gold); letter-spacing: .12em; text-shadow: 2px 2px 0 #140f24; }
  .mnote { margin: -2px 6px 10px; font-size: 13px; line-height: 1.4; color: var(--muted); }
  .mlist { display: grid; gap: 2px; }
  .mitem { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 6px; width: 100%; padding: 8px 10px 8px 4px; text-align: left;
    background: transparent; border: 0; color: var(--ink); font: 600 18px var(--display); cursor: pointer; border-radius: 4px;
    animation: mitem .35s cubic-bezier(.2,.9,.3,1) both; transition: background .12s, color .12s, transform .12s; }
  @keyframes mitem { from { opacity: 0; transform: translateX(-14px); } }
  .mitem small { display: block; font: 500 12px var(--display); color: var(--muted); margin-top: 1px; }
  .mitem .mval { font-size: 15px; color: var(--muted); }
  .mitem.sel { background: linear-gradient(90deg, rgba(242,193,78,.24), rgba(242,193,78,.04)); color: #fff3c4; transform: translateX(4px); }
  .mitem.sel .mval { color: var(--gold); }
  .mitem .mcur { width: 22px; height: 22px; opacity: 0; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><path fill='%23281820' d='M0 3h1v-1h1v-1h1v-1h1v1h1v1h1v1h1v2h-1v1h-1v1h-1v1h-1v-1h-1v-1h-1v-1h-1z'/><path fill='%23f2c14e' d='M1 3h1v-1h1v-1h1v1h1v1h1v2h-1v1h-1v1h-1v-1h-1v-1h-1z'/><path fill='%23fff3c4' d='M2 3h1v-1h1v1h-1v1h-1z'/></svg>") center/contain no-repeat;
    image-rendering: pixelated; }
  .mitem.sel .mcur { opacity: 1; animation: mcur .7s ease-in-out infinite; }
  @keyframes mcur { 50% { transform: translateX(4px) scale(1.08); } }
  .mitem.press { animation: mpress .18s ease-out; }
  @keyframes mpress { 50% { transform: translateX(10px) scale(1.03); filter: brightness(1.6); } }
  .mitem:disabled { opacity: .4; cursor: default; }
  .mitem.info { cursor: default; }
  .mitem.back { color: var(--muted); font-size: 15px; margin-top: 4px; }
  .mitem:focus-visible { outline: 2px solid var(--gold); }
  .mfoot { margin: 8px 0 0; text-align: center; font-size: 11px; letter-spacing: .12em; color: var(--muted); }
  @media (max-height: 430px) { .mitem { padding: 5px 8px 5px 2px; font-size: 16px; } .mbox { padding: 8px 10px 6px; } #menuRoot { gap: 4px; } }
  @media (prefers-reduced-motion: reduce) { .mbox, .mitem, .mlogo, .mitem.sel .mcur { animation: none !important; } }
  /* ---------- spelets knapprad ---------- */
  #playbar { position: fixed; z-index: 2; top: max(6px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
  #playbar button { font: 600 15px var(--display); color: var(--ink); background: rgba(23,31,77,0.82); border: 2px solid rgba(247,240,224,0.55); padding: 6px 12px; min-height: 36px; cursor: pointer; }
  #playbar button:focus-visible { outline: 2px solid var(--gold); }
  .btnrow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button#build { font: 700 18px var(--display); letter-spacing: 0.05em; color: var(--ink); background: transparent; border: 3px solid var(--ink); padding: 12px 16px; cursor: pointer; box-shadow: 0 5px 0 #0b0f2b; }
  button#build:active { transform: translateY(3px); box-shadow: 0 2px 0 #0b0f2b; }

  /* ---------- editorn ---------- */
  :root { --side: 236px; --bar: 46px; --line: rgba(247,240,224,0.18); --panel: #141a40; --panel2: #1c2456; }
  #ed {
    position: fixed; inset: 0; z-index: 3; pointer-events: none; display: grid;
    grid-template-columns: auto 1fr var(--side); grid-template-rows: auto 1fr;
    grid-template-areas: "top top top" "tools map side";
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    font: 500 14px var(--display); color: var(--ink); }
  #ed > * { pointer-events: auto; }
  #ed button, #studio button { font: inherit; color: inherit; cursor: pointer; }
  #ed select, #ed input, #ed textarea, #studio select, #studio input { font: 500 16px var(--display); color: var(--ink); background: #0d1130; border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; min-height: 36px; min-width: 0; }
  #ed textarea { width: 100%; resize: vertical; font-size: 15px; line-height: 1.35; }
  #ed input[type=checkbox], #studio input[type=checkbox] { width: 22px; height: 22px; min-height: 0; accent-color: var(--gold); }
  .ic { display: inline-grid; place-items: center; }
  .top { grid-area: top; display: flex; align-items: center; gap: 6px; padding: 5px 8px; background: var(--panel); border-bottom: 2px solid #0b0f2b; min-height: var(--bar); }
  .top .lvl { max-width: 160px; }
  .status { flex: 1; min-width: 0; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status.ok { color: #9be38f; } .status.bad { color: #ff9a8a; }
  .peers { display: flex; gap: 4px; }
  .chip { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #0d0b12; font-weight: 700; font-size: 13px; border: 2px solid var(--ink); }
  .ib, .tool { width: 40px; height: 40px; display: grid; place-items: center; background: transparent; border: 1px solid transparent; border-radius: 6px; }
  .ib:hover, .tool:hover { background: rgba(255,255,255,0.08); }
  .ib:disabled { opacity: 0.35; cursor: default; }
  .tool.on { background: var(--gold); color: #2a1a08; }
  .tool.small { font-size: 13px; font-weight: 700; }
  .tool .txt { font-size: 20px; line-height: 1; }
  .ib:focus-visible, .tool:focus-visible, .btn:focus-visible, .cell:focus-visible, .tabs button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; min-height: 36px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; }
  .btn.gold { background: var(--gold); color: #2a1a08; border-color: #8a5a12; font-weight: 700; }
  .btn.danger { background: #6b1f2a; border-color: #b4495a; }
  .btn.small { padding: 4px 10px; min-height: 30px; font-size: 13px; }
  .btn.wide { width: 100%; justify-content: center; margin-bottom: 8px; }
  .tools { grid-area: tools; display: flex; flex-direction: column; gap: 2px; padding: 6px 4px; background: var(--panel); border-right: 2px solid #0b0f2b; overflow-y: auto; scrollbar-width: none; }
  .tools .sep, .stools .sep { height: 1px; background: var(--line); margin: 4px 2px; }
  #ed-map { grid-area: map; pointer-events: none; position: relative; min-height: 0; }
  .hint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); max-width: calc(100% - 24px); padding: 5px 10px; background: rgba(13,17,48,0.78); border-radius: 6px; font-size: 13px; color: var(--muted); text-align: center; text-wrap: balance; }
  .banner { position: absolute; top: 8px; left: 8px; right: 8px; padding: 8px 10px; background: #6b1f2a; border: 1px solid #b4495a; border-radius: 6px; font-size: 13px; }
  .side { grid-area: side; display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 2px solid #0b0f2b; }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
  .tabs[hidden] { display: none; }
  .tabs button { padding: 10px 2px; background: transparent; border: 0; border-bottom: 3px solid transparent; font-size: 14px; color: var(--muted); }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--gold); }
  .pal, .props { flex: 1; overflow-y: auto; padding: 8px; overscroll-behavior: contain; }
  .pal h3, .props h3, .form h3 { margin: 10px 2px 6px; font-size: 13px; letter-spacing: 0.04em; color: var(--gold); font-weight: 600; }
  .pal h3:first-child { margin-top: 2px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 5px; }
  .cellwrap { position: relative; display: grid; }
  .cell { display: grid; justify-items: center; gap: 2px; padding: 5px 2px 4px; background: var(--panel2); border: 2px solid transparent; border-radius: 6px; min-height: 64px; }
  .cell img { width: 36px; height: 36px; object-fit: contain; image-rendering: pixelated; }
  .cell span { font-size: 11px; line-height: 1.1; text-align: center; color: var(--muted); overflow-wrap: anywhere; }
  .cell.on { border-color: var(--gold); background: #2a3270; }
  .cell.on span { color: var(--ink); }
  .mini { position: absolute; top: 2px; right: 2px; width: 26px; height: 26px; display: grid; place-items: center; background: rgba(13,17,48,0.85); border: 1px solid var(--line); border-radius: 5px; padding: 0; }
  .drow .mini { position: static; }
  #ed .search { width: 100%; margin-bottom: 8px; }
  .muted { color: var(--muted); font-size: 13px; line-height: 1.4; margin: 6px 2px; }
  .back { background: transparent; border: 0; color: var(--gold); padding: 4px 2px 8px; font-size: 14px; }
  .phead { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .phead img { width: 40px; height: 40px; object-fit: contain; image-rendering: pixelated; background: var(--panel2); border-radius: 6px; }
  .phead b { display: block; font-size: 16px; } .phead small { color: var(--muted); }
  .form { display: grid; gap: 9px; }
  .fld { display: grid; gap: 3px; }
  .fld label { font-size: 13px; color: var(--ink); }
  .fld small { font-size: 12px; color: var(--muted); line-height: 1.3; }
  .fld.inline { grid-template-columns: auto 1fr; align-items: center; column-gap: 8px; }
  .fld.inline label { order: 2; } .fld.inline input { order: 1; } .fld.inline small { order: 3; grid-column: 1 / -1; }
  .drops { display: grid; gap: 5px; }
  .drow { display: grid; grid-template-columns: 1fr 64px auto auto; gap: 4px; align-items: center; }
  .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; } .row.end { justify-content: flex-end; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .menu { position: fixed; z-index: 6; top: calc(var(--bar) + env(safe-area-inset-top, 0px) + 4px); right: calc(env(safe-area-inset-right, 0px) + 8px); width: min(270px, calc(100vw - 16px)); max-height: 70vh; overflow-y: auto; display: grid; padding: 6px; background: var(--panel2); border: 2px solid var(--ink); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  .menu[hidden] { display: none; }
  .menu button { text-align: left; padding: 10px 10px; background: transparent; border: 0; border-radius: 4px; }
  .menu button:hover, .menu button:focus-visible { background: rgba(255,255,255,0.08); outline: none; }
  .menu button.danger { color: #ff9a8a; }
  .modal { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; padding: 16px; background: rgba(5,6,16,0.6); }
  .modal[hidden] { display: none; }
  .dlg { width: min(440px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; padding: 18px; background: var(--frame); border: 3px solid var(--ink); outline: 3px solid #140f24; box-shadow: inset 0 0 0 3px #9e9180; color: var(--ink); font: 500 15px var(--display); }
  .dlg h2 { margin: 0 0 12px; color: var(--gold); font-size: 22px; }
  .dlg p { line-height: 1.45; margin: 0 0 8px; }
  .dlg .err { color: #ff9a8a; }
  .flags { display: grid; gap: 8px; } .flag { display: grid; gap: 2px; padding: 8px; background: rgba(0,0,0,0.25); border-radius: 6px; }
  .flag small { color: var(--muted); } .flag .warn { color: #ffb347; }
  .help p { font-size: 14px; }
  .toast { position: fixed; z-index: 7; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 54px); transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 9px 14px; background: var(--frame); border: 2px solid var(--ink); font-size: 14px; text-align: center; }
  @media (max-aspect-ratio: 1/1) {
    #ed { grid-template-columns: auto 1fr; grid-template-rows: auto 1fr 44%; grid-template-areas: "top top" "tools map" "side side"; }
    .side { border-left: 0; border-top: 2px solid #0b0f2b; }
  }
  @media (max-width: 700px) and (min-aspect-ratio: 1/1) { #ed { --side: 200px; } .top .lbl { display: none; } .grid { grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); } }
  @media (max-height: 430px) { .tool { width: 36px; height: 34px; } .ib { width: 36px; height: 36px; } .top { padding: 3px 6px; } }
  @media (max-width: 560px) { .top .lvl { max-width: 112px; } .status { display: none; } }

  /* ---------- ritverktyget ---------- */
  .gdlg { width: min(720px, 100%); }
  .gtabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
  .gtab { padding: 7px 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; color: var(--muted); }
  .gtab.on { background: var(--gold); color: #2a1a08; border-color: #8a5a12; }
  .ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; max-height: 52vh; overflow-y: auto; padding: 2px; }
  .gcell { display: grid; justify-items: center; gap: 3px; padding: 6px 3px; background: var(--panel2); border: 2px solid transparent; border-radius: 6px; }
  .gcell:hover, .gcell:focus-visible { border-color: var(--gold); outline: none; }
  .gcell img { width: 44px; height: 44px; object-fit: contain; image-rendering: pixelated; }
  .gcell span { font-size: 11px; line-height: 1.15; text-align: center; color: var(--ink); overflow-wrap: anywhere; }
  #studio { position: fixed; inset: 0; z-index: 9; background: var(--night); color: var(--ink); font: 500 14px var(--display);
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  .sbox { height: 100%; display: grid; grid-template-rows: auto 1fr; }
  .shead { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; background: #141a40; border-bottom: 2px solid #0b0f2b; }
  .shead input[type=text] { width: 150px; }
  .stitle { color: var(--gold); font-size: 18px; margin-right: 4px; }
  .grow { flex: 1; }
  .chk { display: inline-flex; gap: 6px; align-items: center; }
  .chk[hidden] { display: none; }
  .sbody { display: grid; grid-template-columns: 1fr minmax(240px, 320px); min-height: 0; }
  .sleft { display: grid; grid-template-columns: auto 1fr; grid-template-rows: 1fr auto; min-height: 0; }
  .stools { grid-row: 1 / span 2; display: flex; flex-direction: column; gap: 2px; padding: 6px 4px; background: #141a40; overflow-y: auto; }
  .scvwrap { min-height: 0; display: grid; place-items: center; overflow: hidden; padding: 4px; }
  .scv { touch-action: none; image-rendering: pixelated; box-shadow: 0 0 0 2px #0b0f2b, 0 0 0 4px rgba(247,240,224,0.35); cursor: crosshair; }
  .colrow { display: flex; gap: 8px; align-items: center; padding: 6px 8px; background: #141a40; }
  .colors { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(26px, 1fr)); gap: 3px; }
  .sw { height: 26px; border: 2px solid rgba(0,0,0,0.5); border-radius: 4px; padding: 0; }
  .sw.on { border-color: var(--ink); box-shadow: 0 0 0 2px var(--gold); }
  .colrow input[type=color] { width: 44px; height: 40px; padding: 2px; }
  .sright { overflow-y: auto; padding: 10px; background: #141a40; border-left: 2px solid #0b0f2b; display: grid; align-content: start; gap: 10px; }
  .sright h3 { margin: 0; font-size: 13px; color: var(--gold); font-weight: 600; }
  .prev { image-rendering: pixelated; max-width: 100%; border: 2px solid #0b0f2b; justify-self: start; }
  .gen { display: flex; gap: 6px; flex-wrap: wrap; } .gen[hidden], .frames[hidden] { display: none; }
  .frames { display: grid; grid-template-columns: auto repeat(3, 1fr); gap: 4px; align-items: center; }
  .fh { font-size: 12px; color: var(--muted); text-align: center; }
  .fbtn { padding: 3px; background: #0d1130; border: 2px solid transparent; border-radius: 5px; display: grid; place-items: center; }
  .fbtn.on { border-color: var(--gold); }
  .fthumb { width: 100%; max-width: 48px; aspect-ratio: auto; image-rendering: pixelated; background: repeating-conic-gradient(#cfc8bb 0 25%, #e9e3d8 0 50%) 0 0 / 8px 8px; }
  .smsg { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
  @media (max-aspect-ratio: 1/1) { .sbody { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } .sright { border-left: 0; border-top: 2px solid #0b0f2b; max-height: 38vh; } }
  @media (max-height: 430px) and (min-aspect-ratio: 1/1) { .sbody { grid-template-columns: 1fr 260px; } .shead input[type=text] { width: 110px; } .shead { padding: 3px 6px; } }
</style>

  const g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  for (const layer of [0, 1])
    for (let y = 0; y < L.height; y++)
      for (let x = 0; x < L.width; x++) {
        const k = tileSprite(layer, x, y);
        if (k && IMG[k]) g.drawImage(IMG[k], x * PPU, (L.height - 1 - y) * PPU);
      }
  G.tileCanvas = c;
}

function loadLevel(name) {
  const src = getLevel(name);
  if (!src) { showMessage(`Hittar inte banan "${name}"`); return false; }
  G.level = JSON.parse(JSON.stringify(src));
  G.levelName = name;
  G.entities = [];
  G.effects = []; G.fx = [];
  for (const o of G.level.objects) { const e = createEntity(o); if (e) G.entities.push(e); }
  renderTiles();
  return true;
}

function place(placeId) {
  G.lastPlace = placeId;
  if (placeId === "__test" && G.testSpot) {
    const p = G.player; p.x = G.testSpot.x; p.y = G.testSpot.y; p.facing = { x: 0, y: -1 }; p.knockUntil = 0;
    placeP2(); G.doorBlockedUntil = G.time + 0.6; snapCamera(); return;
  }
  let o = G.level.objects.find(q => q.id === placeId) || G.level.objects.find(q => q.type === "spawn");
  const p = G.player;
  if (o) { p.x = o.x; p.y = o.y; } else { p.x = G.level.width / 2; p.y = G.level.height / 2; }
  const f = o && o.type === "spawn" ? param(o, "SpawnPoint.facing", "Ner") : "Ner";
  p.facing = { Upp: { x: 0, y: 1 }, Vänster: { x: -1, y: 0 }, Höger: { x: 1, y: 0 } }[f] || { x: 0, y: -1 };
  p.knockUntil = 0;
  placeP2();
  G.doorBlockedUntil = G.time + 0.6;
  snapCamera();
}

function travel(level, placeId) {
  if (G.busy) return;
  G.busy = true;
  fadeTo(1, 0.25, () => {
    if (level && level !== G.levelName) { loadLevel(level); G.pristine = JSON.stringify(G.level); }
    place(placeId);
    setTimeout(() => fadeTo(0, 0.25, () => { G.busy = false; autosave(); }), 100);
  });
}

let fadeAnim = null;
function fadeTo(target, secs, done) {
  fadeAnim = { from: G.fade, to: target, t: 0, secs, done };
}

// ----------------------------------------------------------------------------- entiteter
function body(e) { const c = e.col; return { x0: e.x + c.ox - c.w / 2, x1: e.x + c.ox + c.w / 2, y0: e.y + c.oy - c.h / 2, y1: e.y + c.oy + c.h / 2 }; }

function blocked(e, nx, ny) {
  const c = e.col;
  const b = { x0: nx + c.ox - c.w / 2, x1: nx + c.ox + c.w / 2, y0: ny + c.oy - c.h / 2, y1: ny + c.oy + c.h / 2 };
  for (let ty = Math.floor(b.y0); ty <= Math.floor(b.y1 - 1e-4); ty++)
    for (let tx = Math.floor(b.x0); tx <= Math.floor(b.x1 - 1e-4); tx++)
      if (solidTile(tx, ty)) return { tile: true };
  for (const o of G.entities) {
    if (o === e || !o.solid || o.dead) continue;
    if (boxOverlap(b, body(o))) return o;
  }
  return null;
}

function moveWithCollision(e, vx, vy, dt) {
  let hit = null;
  const nx = e.x + vx * dt;
  const bx = blocked(e, nx, e.y);
  if (!bx) e.x = nx; else hit = bx;
  const ny = e.y + vy * dt;
  const by = blocked(e, e.x, ny);
  if (!by) e.y = ny; else hit = hit || by;
  return hit;
}

function drawSprite(key, x, y, opts = {}) {
  const im = IMG[key];
  if (!im || !im.width) return;
  const s = opts.scale || 1;
  const w = im.width * s, h = im.height * s;
  const px = Math.round((x - view.x0) * PPU), py = Math.round((view.y1 - y) * PPU);
  const ctx = view.ctx;
  ctx.save();
  if (opts.alpha !== undefined) ctx.globalAlpha = opts.alpha;
  if (opts.rot || opts.flip) {
    ctx.translate(px, py);
    if (opts.rot) ctx.rotate(opts.rot);
    if (opts.flip) ctx.scale(-1, 1);
    if (pivotCenter(key)) ctx.drawImage(im, Math.round(-w / 2), Math.round(-h / 2), w, h);
    else ctx.drawImage(im, Math.round(-w / 2), -h, w, h);
  } else {
    if (pivotCenter(key)) ctx.drawImage(im, Math.round(px - w / 2), Math.round(py - h / 2), w, h);
    else ctx.drawImage(im, Math.round(px - w / 2), py - h, w, h);
  }
  ctx.restore();
}

function spawnSlash(x, y, f) {
  const rot = -(Math.atan2(f.y, f.x) - Math.PI / 2);
  G.effects.push({ key: "Effects/slash", x, y, rot, until: G.time + 0.12 });
}

function createEntityBase(o) {
  const t = o.type;

      return makePickup(item, o.x, o.y, param(o, "Pickup.amount", 1), t === "item" ? o : null);
    }

      const e = {
        kind: "chest", x: o.x, y: o.y, sprite: "Items/chest_closed", col: { w: 0.9, h: 0.55, ox: 0, oy: 0.3 }, solid: true, shadow: 1.1, order: 5,

    case "spawn": return null;
    case "door_zone": case "teleport": {
      const tele = t === "teleport";
      const w = param(o, "Door.width", tele ? 0.8 : 1), h = param(o, "Door.height", tele ? 0.8 : 0.6);
      return {

        col: { w, h, ox: 0, oy: 0 },
        targetLevel: param(o, "Door.targetLevel", ""), targetPlace: param(o, "Door.targetPlace", ""),
        requiresSword: param(o, "Door.requiresSword", false), lockedMessage: param(o, "Door.lockedMessage", "Det är låst."),
        nextMsg: 0,
        enter(p) {
          if (G.time < G.doorBlockedUntil || G.busy) return;

            if (G.time > this.nextMsg) { showMessage(this.lockedMessage); this.nextMsg = G.time + 1.5; }
            p.knock(p.x - this.x, p.y - this.y, 4, 0.12);
            return;
          }
          travel(this.targetLevel || G.levelName, this.targetPlace);
        },
      };
    }
    case "event": return {
      kind: "event", x: o.x, y: o.y, trigger: true, order: 0,
      col: { w: param(o, "EventZone.width", 1), h: param(o, "EventZone.height", 1), ox: 0, oy: 0 },
      speaker: param(o, "EventZone.speaker", ""), lines: param(o, "EventZone.lines", []),
      talkTo: param(o, "EventZone.talkTo", ""), requireFlag: param(o, "EventZone.requireFlag", ""),
      requireItem: param(o, "EventZone.requireItem", ""), setFlag: param(o, "EventZone.setFlag", ""),
      giveItem: param(o, "EventZone.giveItem", ""), once: param(o, "EventZone.once", true), done: false,
      enter() {
        if ((this.once && this.done) || dialog.open) return;

        this.done = true;
        const reward = () => { setFlag(this.setFlag); if (this.giveItem) give(this.giveItem); };
        if (this.talkTo) {
          const npc = G.entities.find(e => e.isNpc && e.id === this.talkTo && !e.dead);
          if (npc && npc.interact()) { reward(); return; }
        }
        if (this.lines.length) openDialog(this.speaker, this.lines, reward); else reward();

    };
    default: {
      const ct = typeof CONTENT_TYPES !== "undefined" && CONTENT_TYPES[t];
      if (ct) {
        if (ct.base === "item") return makePickup(param(o, "Pickup.itemId", ct.item), o.x, o.y, param(o, "Pickup.amount", 1), o);
        if (ct.base === "monster") return makeSlime(o, ct);
        if (ct.base === "person") return makeNpc(o);
        if (ct.base === "prop") {

        return { kind: "prop", x: o.x, y: o.y, sprite: "C/" + name, col: { w: solid ? Math.max(0.4, w * 0.8) : 0, h: solid ? 0.5 : 0, ox: 0, oy: 0.3 }, solid, shadow: 0, order: 5 };

}

function makePickup(item, x, y, amount = 1, o = null) {
  const def = ITEMS[item];
  return {
    kind: "pickup", x, y, baseY: y, sprite: def ? def.icon : "Items/potion", item, amount,
    col: { w: 0.7, h: 0.7, ox: 0, oy: 0.35 }, trigger: true, shadow: 0.7, order: 5, phase: x,
    update() { this.y = this.baseY + Math.sin(G.time * 4 + this.phase) * 0.05; },
    props: o ? resolveItem(item, o) : null,
    enter(p) { this.dead = true; give(this.item, this.amount, this.item !== "gem_green" && this.item !== "gem_blue" && this.item !== "gem_red" && this.item !== "heart", this.props, p); },
  };
}
function spawnItem(item, x, y) { G.entities.push(makePickup(item, x, y)); }
function spawnDrops(text, x, y) {
  let n = 0;
  for (const part of (text || "").split(";")) {
    const p = part.trim(); if (!p) continue;
    const i = p.lastIndexOf(":");
    const id = i >= 0 ? p.slice(0, i).trim() : p;
    const ch = i >= 0 ? parseFloat(p.slice(i + 1)) : 100;
    if (Math.random() * 100 >= ch) continue;
    spawnItem(id, x + ((n % 3) - 1) * 0.4, y - Math.floor(n / 3) * 0.3);
    n++;
  }
}

function makeSlime(o, look) {
  const fr = look ? look.frames : ["Enemies/slime_0", "Enemies/slime_1"];
  return {
    kind: "slime", x: o.x, y: o.y, sprite: fr[0], frames: fr, col: { w: 0.6, h: 0.45, ox: 0, oy: 0.3 }, solid: false,
    shadow: 1, order: 5, hp: param(o, "Health.maxHealth", look ? look.hp : 2), inv: 0, speed: param(o, "SlimeEnemy.speed", look ? look.speed : 1.4),
    chase: param(o, "SlimeEnemy.chaseRange", look ? look.chase : 4.5), damage: param(o, "SlimeEnemy.damage", look ? look.damage : 1),
    dropChance: param(o, "SlimeEnemy.dropChance", 0.6), wander: { x: 0, y: 0 }, nextWander: 0, knockUntil: 0, kv: null, anim: 0,
    hurtable: true,
    hurt(f, d = 1) {
      if (G.time < this.inv) return;
      this.hp -= d; this.inv = G.time + 0.3; this.flashUntil = this.inv;
      this.kv = { x: f.x * 8, y: f.y * 8 }; this.knockUntil = G.time + 0.15;
      if (this.hp <= 0) { this.dead = true; if (Math.random() < this.dropChance) spawnItem("gem_green", this.x, this.y); }
    },
    update(dt) {
      this.anim += dt;
      this.sprite = this.frames[Math.floor(this.anim / 0.3) % 2];
      const p = nearestPlayer(this.x, this.y);
      let v = { x: 0, y: 0 };
      const d = dist(p.x, p.y, this.x, this.y);
      if (G.time < this.knockUntil) v = this.kv;
      else if (!p.dead && d < this.chase) { v = { x: (p.x - this.x) / d * this.speed, y: (p.y - this.y) / d * this.speed }; }
      else {
        if (G.time > this.nextWander) {
          this.nextWander = G.time + 1 + Math.random() * 1.5;
          const a = Math.random() * Math.PI * 2;
          this.wander = Math.random() < 0.3 ? { x: 0, y: 0 } : { x: Math.cos(a), y: Math.sin(a) };
        }
        v = { x: this.wander.x * this.speed * 0.5, y: this.wander.y * this.speed * 0.5 };
      }
      moveWithCollision(this, v.x, v.y, dt);
      if (!p.dead && d < 0.6 && G.time > p.invUntil) { p.hurt(this.damage); p.knock(p.x - this.x, p.y - this.y); }
    },
  };
}

// ----------------------------------------------------------------------------- personer
function makeNpc(o) {
  const t = o.type;
  const isMom = t === "mom";
  const custom = t.startsWith("egen/");
  const defaults = custom
    ? { speakerName: niceName(t.slice(5)), appearance: t, firstLines: ["Hej!"], repeatLines: [], givesSword: false, paceDistance: 2, movement: "StårStill", showEmote: false, hp: 3 }
    : isMom
    ? { speakerName: "Mamma", appearance: "mamma", firstLines: MOM_LINES, repeatLines: MOM_REPEAT, givesSword: true, paceDistance: 3.5, movement: "FramOchTillbaka", showEmote: true, hp: 0 }
    : t === "knight"
      ? { speakerName: "Riddare", appearance: "riddare", firstLines: [], repeatLines: [], givesSword: false, paceDistance: 3, movement: "Vandrar", showEmote: false, hp: 4, hostile: true, heldItem: "sword", drops: "gem_blue:60;heart:30" }
      : { speakerName: "Bybo", appearance: "bybo", firstLines: ["Hej!"], repeatLines: [], givesSword: false, paceDistance: 2, movement: "StårStill", showEmote: false, hp: 3 };
  const P = (k, d) => param(o, "NPC." + k, d);
  const n = {
    kind: "npc", isNpc: true, id: o.id, x: o.x, y: o.y, home: { x: o.x, y: o.y },
    col: { w: 0.6, h: 0.3, ox: 0, oy: 0.15 }, solid: true, shadow: 1, order: 5,
    speakerName: P("speakerName", defaults.speakerName),
    figure: FIGURES[P("appearance", "") || defaults.appearance] || FIGURES[defaults.appearance] || FIGURES.bybo,
    trigger: P("trigger", "NärManPratar"), triggerRange: P("triggerRange", 2), onlyOnce: P("onlyOnce", false),
    firstLines: P("firstLines", defaults.firstLines), repeatLines: P("repeatLines", defaults.repeatLines),
    requireFlag: P("requireFlag", ""), requireItem: P("requireItem", ""), lockedLines: P("lockedLines", []),
    takesItem: P("takesItem", false), setFlag: P("setFlag", ""), giveItem: P("giveItem", ""), givesSword: P("givesSword", defaults.givesSword),
    movement: P("movement", defaults.movement), paceDistance: P("paceDistance", defaults.paceDistance), paceSpeed: P("paceSpeed", 1.6),
    hostile: P("hostile", !!defaults.hostile), heldItem: P("heldItem", defaults.heldItem || ""), damage: P("damage", 1),
    aggroRange: P("aggroRange", 5), drops: P("drops", defaults.drops || ""), showEmote: P("showEmote", defaults.showEmote),
    hasEmote: isMom, hp: param(o, "Health.maxHealth", defaults.hp || 3),
    facing: { x: 0, y: -1 }, moving: false, anim: 0, step: 0, talking: false, talked: false, inRange: false,
    paceDir: 1, pauseUntil: 0, nextWander: 0, wander: { x: 0, y: 0 }, nextAttack: 0, knockUntil: 0, kv: null, inv: 0,
  };
  n.hurtable = n.hostile;
  n.armed = !!n.heldItem && (n.heldItem === "sword" || (ITEMS[n.heldItem] && ITEMS[n.heldItem].weapon));

  n.hurt = function (f, d = 1) {
    if (!this.hostile || G.time < this.inv) return;
    this.hp -= d; this.inv = G.time + 0.3; this.flashUntil = this.inv;
    this.kv = { x: f.x * 7, y: f.y * 7 }; this.knockUntil = G.time + 0.15;
    if (this.hp <= 0) { this.dead = true; spawnDrops(this.drops, this.x, this.y + 0.2); }
  };

  n.interact = function () {
    if (this.talking || (this.onlyOnce && this.talked)) return false;
    const ok = hasFlag(this.requireFlag) && (!this.requireItem || invHas(this.requireItem));
    const ls = !ok ? this.lockedLines : (!this.talked || !this.repeatLines.length) ? this.firstLines : this.repeatLines;
    if (!ls || !ls.length) return false;
    this.talking = true; this.moving = false;
    const p = nearestPlayer(this.x, this.y);
    this.facing = snap4(p.x - this.x, p.y - this.y);
    const first = ok && !this.talked;
    openDialog(this.speakerName, ls, () => {
      this.talking = false; this.pauseUntil = G.time + 1;
      if (!ok) return;
      this.talked = true; this.showEmote = false;
      if (!first) return;
      if (this.takesItem && this.requireItem) invTake(this.requireItem);
      setFlag(this.setFlag);
      if (this.givesSword && !G.inv.sword) give("sword");
      if (this.giveItem) give(this.giveItem);
    });
    return true;
  };

  n.update = function (dt) {
    const p = nearestPlayer(this.x, this.y);
    const d = dist(p.x, p.y, this.x, this.y);
    if (this.trigger === "NärManKommerNära" && !this.hostile) {
      const near = d <= this.triggerRange;
      if (near && !this.inRange && !this.talking && !dialog.open) this.interact();
      this.inRange = near;
    }

    // strid
    if (this.hostile && !this.talking && !p.dead) {
      if (this.armed) {
        if (d < 1.15 && G.time > this.nextAttack) {
          this.nextAttack = G.time + 1.1;
          const dx = (p.x - this.x) / (d || 1), dy = (p.y - this.y) / (d || 1);
          this.facing = snap4(dx, dy);
          spawnSlash(this.x + this.facing.x * 0.6, this.y + 0.5 + this.facing.y * 0.6, this.facing);
          p.hurt(this.damage); p.knock(dx, dy);
        }
      } else if (d < 0.6 && G.time > p.invUntil) { p.hurt(this.damage); p.knock(p.x - this.x, p.y - this.y); }
    }

    // rörelse
    let v = { x: 0, y: 0 };
    if (G.time < this.knockUntil) v = this.kv;
    else if (this.talking) v = { x: 0, y: 0 };
    else if (this.hostile && !p.dead && d < this.aggroRange) {
      if (d > (this.armed ? 0.9 : 0.1)) v = { x: (p.x - this.x) / d * this.paceSpeed * 1.1, y: (p.y - this.y) / d * this.paceSpeed * 1.1 };
    } else if (this.movement === "FramOchTillbaka") {
      if (this.paceDistance > 0 && G.time >= this.pauseUntil) {
        const target = this.home.x + this.paceDir * this.paceDistance * 0.5;
        if (Math.abs(this.x - target) < 0.05) { this.paceDir = -this.paceDir; this.pauseUntil = G.time + 0.7; }
        else v = { x: Math.sign(target - this.x) * this.paceSpeed, y: 0 };
      }
    } else if (this.movement === "Vandrar") {
      if (G.time > this.nextWander) {
        this.nextWander = G.time + 1 + Math.random() * 1.5;
        const a = Math.random() * Math.PI * 2;
        this.wander = Math.random() < 0.35 ? { x: 0, y: 0 } : { x: Math.cos(a), y: Math.sin(a) };
        if (dist(this.x, this.y, this.home.x, this.home.y) > Math.max(1, this.paceDistance)) {
          const hd = dist(this.x, this.y, this.home.x, this.home.y);
          this.wander = { x: (this.home.x - this.x) / hd, y: (this.home.y - this.y) / hd };
        }
      }
      v = { x: this.wander.x * this.paceSpeed * 0.6, y: this.wander.y * this.paceSpeed * 0.6 };
    } else if (this.movement === "FöljerSpelaren") {
      if (d > 1.4 && d < 30) v = { x: (p.x - this.x) / d * this.paceSpeed * 1.4, y: (p.y - this.y) / d * this.paceSpeed * 1.4 };
    }
    // håll avstånd till spelaren så man inte fastnar
    if (!this.hostile && d < 0.7 && G.time >= this.knockUntil) v = { x: 0, y: 0 };

    // begränsa steget så den inte hoppar förbi målet
    if (this.movement === "FramOchTillbaka" && v.x && !this.hostile) {
      const target = this.home.x + this.paceDir * this.paceDistance * 0.5;
      if (Math.abs(v.x * dt) > Math.abs(target - this.x)) v.x = (target - this.x) / dt;
    }
    this.moving = Math.hypot(v.x, v.y) > 0.01;
    if (this.moving && G.time >= this.knockUntil) this.facing = snap4(v.x, v.y);
    const before = { x: this.x, y: this.y };
    moveWithCollision(this, v.x, v.y, dt);
    if (this.movement === "FramOchTillbaka" && this.moving && !this.hostile && Math.abs(this.x - before.x) < 1e-5) { this.paceDir = -this.paceDir; this.pauseUntil = G.time + 0.7; }

    // animation
    const set = this.facing.y > 0 ? this.figure.up : this.facing.x > 0 ? this.figure.right : this.facing.x < 0 ? this.figure.left : this.figure.down;
    if (!this.moving) { this.anim = 0; this.step = 0; this.sprite = set[0]; }
    else {
      this.anim += dt;
      if (this.anim > 0.2) { this.anim = 0; this.step = (this.step + 1) % 4; }
      this.sprite = set[Math.min([1, 0, 2, 0][this.step], set.length - 1)];
    }
  };

  n.drawExtra = function (front) {
    if (this.heldItem && ITEMS[this.heldItem]) {
      const f = this.facing;
      const behind = f.y > 0;
      if (behind !== !front) return;
      let ox = 0.34, oy = 0.42, flip = false;
      if (f.y > 0) { ox = -0.32; oy = 0.5; } else if (f.x > 0) { ox = 0.28; oy = 0.4; } else if (f.x < 0) { ox = -0.28; oy = 0.4; flip = true; }
      drawSprite(ITEMS[this.heldItem].icon, this.x + ox, this.y + oy, { scale: 0.8, flip });
    }
  };
  n.drawOverlay = function () {
    if (this.hasEmote && this.showEmote) drawSprite("Effects/emote_worry", this.x + 0.5, this.y + 1.85 + Math.abs(Math.sin(G.time * 5)) * 0.08);
  };
  n.sprite = n.figure.down[0];
  return n;
}

// ----------------------------------------------------------------------------- spelaren och inventariet
function makePlayer(idx = 0) {
  const p = {
    kind: "player", idx, sel: 0, pre: idx ? "Player/p2" : "Player/player", x: 0, y: 0, col: { w: 0.55, h: 0.3, ox: 0, oy: 0.15 }, solid: true, shadow: 1, order: 5,
    maxHp: 5, hp: 5, invUntil: 0, facing: { x: 0, y: -1 }, anim: 0, step: 0, moving: false,
    nextAttack: 0, frozenUntil: 0, knockUntil: 0, kv: null, dead: false, frozen: false, sprite: "Player/player_down_0",
    hurt(n) {
      if (this.dead || G.time < this.invUntil || shielded(this)) return;
      this.hp = Math.max(0, this.hp - n); this.invUntil = G.time + 1; this.flashUntil = this.invUntil;
      if (this.hp === 0) die(this);
    },
    knock(dx, dy, force = 7, dur = 0.15) {
      const m = Math.hypot(dx, dy) || 1;
      this.kv = { x: dx / m * force, y: dy / m * force }; this.knockUntil = G.time + dur;
    },
  };
  return p;
}
function newInventory() { return { sword: false, gems: 0, keys: 0, entries: [], sel: 0 }; }

function invHas(id) {
  const I = G.inv;
  if (!id) return true;
  if (id === "sword") return I.sword;
  if (id === "key") return I.keys > 0;
  if (id.startsWith("gem_")) return I.gems > 0;
  return invCount(id) > 0;
}
function invTake(id) {
  const I = G.inv;
  if (id === "sword") I.sword = false;
  else if (id === "key") I.keys = Math.max(0, I.keys - 1);
  else invRemove(id, 1);
}
function give(id, amount = 1, announce = true, props = null, who = null) {
  const I = G.inv, p = who || G.player;
  if (id === "sword" && props && propsKey(props) !== propsKey(itemDefaults("sword"))) { invAdd(id, amount, props, announce, p); return; }
  switch (id) {
    case "sword": I.sword = true; if (announce) showMessage("Du fick ett svärd! Tryck A (eller Mellanslag) för att hugga.", 4); return;
    case "key": I.keys += amount; if (announce) showMessage("Du fick en nyckel!"); return;
    case "gem_green": I.gems += 1 * amount; return;
    case "gem_blue": I.gems += 5 * amount; return;
    case "gem_red": I.gems += 20 * amount; return;
    case "heart": p.hp = Math.min(p.maxHp, p.hp + amount); return;
  }
  invAdd(id, amount, props, announce, p);
}
const hasFlag = f => !f || !f.trim() || G.flags.has(f.trim().toLowerCase());
const setFlag = f => { if (f && f.trim()) G.flags.add(f.trim().toLowerCase()); };

function showMessage(text, secs = 2.5) { G.message = text; G.messageUntil = G.time + secs; }

function die(who) {
  const p = G.player;
  who = who || p;
  who.dead = true;
  // coop: den andra lever – kom tillbaka efter 5 sekunder
  const other = G.players.find(q => q !== who && !q.dead);
  if (other) {
    showMessage(`Spelare ${who.idx + 1} svimmade! Tillbaka om 5 sekunder.`, 3);
    setTimeout(() => {
      if (!who.dead || !G.players.includes(who)) return;
      const o2 = G.players.find(q => q !== who && !q.dead); if (!o2) return;
      who.dead = false; who.hp = who.maxHp; who.invUntil = G.time + 1; who.flashUntil = who.invUntil;
      const s = spotNextTo(o2); who.x = s.x; who.y = s.y;
      showMessage(`Spelare ${who.idx + 1} är tillbaka!`, 2);
    }, 5000);
    return;
  }
  for (const q of G.players) q.dead = true;
  showMessage("Du svimmade...");
  G.busy = true;
  setTimeout(() => fadeTo(1, 0.4, () => {
    G.level = JSON.parse(G.pristine);
    G.entities = []; G.effects = []; G.fx = [];
    for (const o of G.level.objects) { const e = createEntity(o); if (e) G.entities.push(e); }
    renderTiles();
    for (const q of G.players) { q.hp = q.maxHp; q.dead = false; q.invUntil = 0; }
    place(G.lastPlace);
    fadeTo(0, 0.4, () => { G.busy = false; });
  }), 1200);
}

function updatePlayer(dt, p = G.player) {
  const inp = IN[p.idx];
  const canAct = !p.dead && !G.busy && !dialog.open && !G.menu && G.frame > dialog.closedFrame + 1;
  let mv = canAct && G.time >= p.frozenUntil ? inp.move : { x: 0, y: 0 };
  const mag = Math.hypot(mv.x, mv.y);
  if (mag > 1) { mv.x /= mag; mv.y /= mag; }
  if (mag > 0.01) p.facing = snap4(mv.x, mv.y);

  if (canAct && inp.action) {
    if (!tryTalk(p) && G.inv.sword && G.time >= p.nextAttack) attack(p);
  }

  updateItemUse(p, canAct, inp.use, inp.cycle);
  let vx = mv.x * 4 * speedMul(p), vy = mv.y * 4 * speedMul(p);
  if (p.dead) vx = vy = 0;
  if (G.time < p.knockUntil) { vx = p.kv.x; vy = p.kv.y; }
  const ox = p.x, oy = p.y;
  const hit = moveWithCollision(p, vx, vy, dt);
  keepNearOther(p, ox, oy);
  if (hit && hit.bump) hit.bump();

  p.moving = mag > 0.01;
  const f = p.facing;
  const dir = f.y > 0 ? "up" : f.y < 0 ? "down" : f.x < 0 ? "left" : "right";
  if (!p.moving) { p.anim = 0; p.step = 0; p.sprite = `${p.pre}_${dir}_0`; }
  else {
    p.anim += dt;
    if (p.anim >= 0.14) { p.anim = 0; p.step = (p.step + 1) % 4; }
    p.sprite = `${p.pre}_${dir}_${[1, 0, 2, 0][p.step]}`;
  }
  if (p.dead) return;

  // triggers (dörrar, föremål, händelser)
  const b = body(p);
  for (const e of G.entities) {
    if (!e.trigger || e.dead) continue;
    const inside = boxOverlap(b, body(e)), key = "inside" + p.idx;
    if (inside && !e[key]) { e[key] = true; e.enter && e.enter(p); }
    else if (!inside) e[key] = false;
  }
}

function tryTalk(p = G.player) {
  const px = p.x + p.facing.x * 0.6, py = p.y + 0.3 + p.facing.y * 0.6;
  for (const e of G.entities) {
    if (!e.isNpc || e.dead || e.hostile || e.trigger === "Aldrig") continue;
    if (circleBox(px, py, 0.5, body(e)) && e.interact()) return true;
  }
  return false;
}

function attack(p = G.player) {
  p.nextAttack = G.time + 0.3;
  p.frozenUntil = G.time + 0.12;
  const cx = p.x + p.facing.x * 0.7, cy = p.y + 0.6 + p.facing.y * 0.7;
  spawnSlash(cx, cy, p.facing);
  for (const e of G.entities) {
    if (e.dead || !e.hurt) continue;
    if (e.kind === "npc" && !e.hostile) continue;
    const b = body(e);
    const tall = { x0: b.x0, x1: b.x1, y0: b.y0, y1: b.y1 + 0.5 };
    if (circleBox(cx, cy, 0.55, tall)) e.hurt(p.facing, strengthMul(p));
  }
}

// ----------------------------------------------------------------------------- dialog
const dialog = { open: false, speaker: "", lines: [], i: 0, shown: 0, done: null, openedFrame: 0, closedFrame: -10 };
function openDialog(speaker, ls, done) {
  if (!ls || !ls.length) { done && done(); return; }
  Object.assign(dialog, { open: true, speaker, lines: ls, i: 0, shown: 0, done, openedFrame: G.frame });
}
function updateDialog(dt) {
  if (!dialog.open) return;
  const line = dialog.lines[dialog.i];
  dialog.shown = Math.min(line.length, dialog.shown + textSpeed() * dt);
  if (G.frame === dialog.openedFrame || !action) return;
  if (dialog.shown < line.length) { dialog.shown = line.length; return; }
  dialog.i++; dialog.shown = 0;
  if (dialog.i >= dialog.lines.length) {
    dialog.open = false; dialog.closedFrame = G.frame;
    const d = dialog.done; dialog.done = null; d && d();
  }
}

// ----------------------------------------------------------------------------- rita
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const view = { ctx, x0: 0, y1: 0, zoom: 1, wU: 0, hU: 0 };
const ui = { s: 2, unit: 40 };

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  view.zoom = Math.max(1, Math.floor(Math.min(h / (PPU * 13), w / (PPU * 11))));
  view.wU = w / (PPU * view.zoom);
  view.hU = h / (PPU * view.zoom);
  ui.s = Math.max(2, view.zoom);
  ui.unit = Math.min(w, h) / 9;
}

function cameraTarget() {
  const L = G.level, alive = G.players.filter(q => !q.dead), ps = alive.length ? alive : G.players;
  let cx = ps.reduce((s, q) => s + q.x, 0) / ps.length, cy = ps.reduce((s, q) => s + q.y, 0) / ps.length + 0.5;
  cx = L.width <= view.wU ? L.width / 2 : clamp(cx, view.wU / 2, L.width - view.wU / 2);
  cy = L.height <= view.hU ? L.height / 2 : clamp(cy, view.hU / 2, L.height - view.hU / 2);
  return { x: cx, y: cy };
}

function render() {
  const W = canvas.width, H = canvas.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = "#0d0b12";
  ctx.fillRect(0, 0, W, H);
  if (!G.level) return;

  const z = view.zoom;
  // kameran låst till hela pixlar
  const sh = shakeOffset();
  const camPxX = Math.round((G.camX - view.wU / 2) * PPU + sh.x), camPxY = Math.round((G.camY + view.hU / 2) * PPU + sh.y);
  view.x0 = camPxX / PPU; view.y1 = camPxY / PPU;
  ctx.setTransform(z, 0, 0, z, 0, 0);
  const L = G.level;
  ctx.drawImage(G.tileCanvas, -camPxX, -(L.height * PPU - camPxY));

  const ents = G.entities.filter(e => !e.dead);
  for (const e of ents) if (e.order <= 1 && e.sprite) drawSprite(e.sprite, e.x, e.y);
  const ghosts = [];
  for (const q of STORE.peers) {
    const pr = q.presence || {};
    if (pr.mode !== "play" || pr.lvl !== G.levelName || typeof pr.cx !== "number" || typeof pr.cy !== "number") continue;
    const key = typeof pr.s === "string" && pr.s.startsWith("Player/") && IMG[pr.s] ? pr.s : "Player/player_down_0";
    ghosts.push({ x: pr.cx, y: pr.cy, sprite: key, shadow: 1, order: 5, ghost: true, who: q });
  }
  const actors = ents.filter(e => e.order === 5).concat(G.players, ghosts);
  for (const e of actors) if (e.shadow) drawSprite("Effects/shadow", e.x, e.y + 0.06, { scale: e.shadow, alpha: 1 });
  actors.sort((a, b) => b.y - a.y);
  for (const e of actors) {
    if (e.kind === "player") { if (e.dead) { drawSprite(e.sprite, e.x, e.y, { alpha: 0.35 }); continue; } drawAura(e); }
    if (e.flashUntil && G.time < e.flashUntil && Math.floor(G.time / 0.06) % 2) continue;
    if (e.ghost) { drawSprite(e.sprite, e.x, e.y, { alpha: 0.75 }); continue; }
    if (e.drawExtra) e.drawExtra(false);
    if (e.sprite) drawSprite(e.sprite, e.x, e.y, e.scale ? { scale: e.scale } : undefined);
    if (e.drawExtra) e.drawExtra(true);
  }
  for (const e of ents) if (e.drawOverlay) e.drawOverlay();
  if (ghosts.length) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    for (const gh of ghosts) {
      const sx = (gh.x - view.x0) * PPU * z, sy = (view.y1 - gh.y - 1.6) * PPU * z;
      text(peerName(gh.who), sx, sy, 6 * ui.s, peerColor(gh.who), "center");
    }
    ctx.setTransform(z, 0, 0, z, 0, 0);
  }
  G.effects = G.effects.filter(f => G.time < f.until);
  for (const f of G.effects) drawSprite(f.key, f.x, f.y, { rot: f.rot });
  drawFx();

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawHud();
  drawDialog();
  drawTouch();
  drawMenu();
  drawAutosaveIcon();
  if (G.fade > 0) { ctx.fillStyle = `rgba(0,0,0,${G.fade})`; ctx.fillRect(0, 0, W, H); }
}

const FONT = '"Pixelify Sans", "Trebuchet MS", system-ui, sans-serif';
function text(str, x, y, size, color, align = "left", maxW) {

  ctx.textAlign = align; ctx.textBaseline = "top";
  ctx.fillStyle = "rgba(0,0,0,0.85)";
  ctx.fillText(str, x + Math.max(1, size / 14), y + Math.max(1, size / 14), maxW);

}
function icon(key, x, y, w, h) { const im = IMG[key]; if (im && im.width) ctx.drawImage(im, Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }

  ctx.fillStyle = `rgba(247,240,224,${a})`; ctx.fillRect(x + s, y + s, w - 2 * s, h - 2 * s);
  ctx.fillStyle = `rgba(158,145,128,${a})`; ctx.fillRect(x + 2 * s, y + 2 * s, w - 4 * s, h - 4 * s);
  ctx.fillStyle = `rgba(23,31,77,${a})`; ctx.fillRect(x + 3 * s, y + 3 * s, w - 6 * s, h - 6 * s);

    if (ctx.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t;

let hudBox = null;

function dialogRect() {

const safeEl = document.getElementById("safe");

  return (parseFloat(v) || 0) * (canvas.width / Math.max(1, canvas.clientWidth));
}
let safeCache = { t: -1 };
function safeAll() { if (safeCache.t !== (G.frame >> 5)) safeCache = { t: G.frame >> 5, top: safe("top"), bottom: safe("bottom"), left: safe("left"), right: safe("right") }; return safeCache; }
const safeTop = () => safeAll().top, safeBottom = () => safeAll().bottom, safeLeft = () => safeAll().left, safeRight = () => safeAll().right;

function buttonCenter() { const u = ui.unit; return { x: canvas.width - u * 1.6 - safeRight(), y: canvas.height - u * 1.8 - safeBottom() }; }
function bButtonCenter() { const u = ui.unit; return { x: canvas.width - u * 3.6 - safeRight(), y: canvas.height - u * 1.2 - safeBottom() }; }

  for (const t of e.changedTouches) {
    const p = canvasPoint(t), b = buttonCenter(), u = ui.unit, bb = bButtonCenter(), cc = cycleCenter();
    if (!dialog.open && dist(p.x, p.y, bb.x, bb.y) < u * 0.95) { touch.bButton = t.identifier; useQueued = true; }
    else if (!dialog.open && dist(p.x, p.y, cc.x, cc.y) < u * 0.7) cycleQueued = true;
    else if (!dialog.open && hudBox && p.x <= hudBox.x + hudBox.w && p.y <= hudBox.y + hudBox.h + 8 * ui.s) menuQueued = true;
    else if (dist(p.x, p.y, b.x, b.y) < u * 1.35 || (dialog.open && p.x > canvas.width * 0.4)) { touch.button = t.identifier; actionQueued = true; }

canvas.addEventListener("touchmove", e => {

// ----------------------------------------------------------------------------- huvudloop
let last = 0;
G.frame = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min(1 / 30, (ts - last) / 1000 || 0);
  last = ts;
  if (ED.active) { resize(); ED.frame(dt); return; }
  if (!ready) return;
  G.time += dt;
  G.frame++;
  resize();
  if (G.paused) { render(); return; }
  readInput();
  if (G.menu) { updateMenu(); render(); return; }
  checkMenuOpen();
  if (G.menu) { render(); return; }

  if (fadeAnim) {
    fadeAnim.t += dt;
    const k = Math.min(1, fadeAnim.t / fadeAnim.secs);
    G.fade = fadeAnim.from + (fadeAnim.to - fadeAnim.from) * k;
    if (k >= 1) { const d = fadeAnim.done; fadeAnim = null; d && d(); }
  }

  G.playTime += dt;
  if (!G.testing && G.time - (G.lastAuto || 0) > 120 && !G.busy && !dialog.open) autosave();
  updateDialog(dt);
  updateCoop();
  for (const q of G.players) updatePlayer(dt, q);
  updateFx(dt);
  for (const e of G.entities) {
    if (e.dead || !e.update) continue;
    if (dialog.open && e.kind !== "pickup") continue;   // världen står still medan man pratar
    e.update(dt);
  }
  G.entities = G.entities.filter(e => !e.dead);

  const t = cameraTarget();
  const k = 1 - Math.pow(0.0001, dt);
  G.camX += (t.x - G.camX) * Math.min(1, k * 2.5);
  G.camY += (t.y - G.camY) * Math.min(1, k * 2.5);
  if (G.time - (G.lastPres || 0) > 0.15) {
    G.lastPres = G.time;
    const p = G.player;
    setPresence({ lvl: G.levelName, mode: "play", cx: Math.round(p.x * 20) / 20, cy: Math.round(p.y * 20) / 20, s: p.sprite, id: STORE.me.id });
  }
  render();
}

function startGame(levelName = "hemma", spot = null) {
  G.flags = new Set();
  G.inv = newInventory();
  G.player = makePlayer();
  G.players = G.p2 ? [G.player, G.p2] : [G.player];
  if (G.p2) { G.p2.hp = G.p2.maxHp; G.p2.dead = false; }
  G.busy = false; fadeAnim = null; G.fade = 0; dialog.open = false; G.message = "";
  G.testing = false; G.testSpot = spot;
  if (!loadLevel(levelName)) loadLevel("hemma");
  G.pristine = JSON.stringify(G.level);

// ----------------------------------------------------------------------------- spara
const saveQueue = {};   // dokumentväg -> { busy, next }

        } else lastErr = e;

  else if (c === "revoked" || c === "not_granted") { STORE.canWrite = false; setStatus("Du kan inte spara här", "bad"); }

    setStatus(ok ? "Sparat på den här enheten" : "Kunde inte spara (minnet fullt)", ok ? "ok" : "bad");
    return;

  try {
    await writeDoc("levels/" + name, { json, by: STORE.me.id, sid: STORE.sid, at: Date.now() });
    setStatus("Sparat ✓", "ok");

}

function emitOps(lvl, ops) {
  const room = STORE.room;
  if (!room || !ops.length) return;
  // högst 4 KiB per meddelande: dela upp, och hoppa över det som ändå är för stort (sparningen tar det)
  let chunk = [], size = 0;
  const flush = () => { if (chunk.length) room.emit("edit", { lvl, ops: chunk }).catch(() => {}); chunk = []; size = 0; };
  for (const op of ops) {
    const s = JSON.stringify(op).length;
    if (s > 3300) continue;
    if (size + s > 3300) flush();
    chunk.push(op); size += s;
  }

// ----------------------------------------------------------------------------- start
async function initStore() {
  if (!window.claude || !window.claude.use) { loadLocal(); STORE.loaded = true; storeChanged("all"); return; }
  const [db, room, user, downloads] = await Promise.all(["db", "room", "user", "downloads"].map(n => window.claude.use(n).catch(() => null)));
  STORE.downloads = downloads;
  STORE.user = user;
  if (user) {
    const me = await user.me();
    STORE.me = { id: me.id, color: me.color || "#f2c14e" };
    const can = await user.can("data.write");
    if (can === false) STORE.canWrite = false;
  }
  if (!db) { loadLocal(); STORE.loaded = true; storeChanged("all"); return; }
  STORE.db = db; STORE.shared = true;
  setStatus("Hämtar banor...", "");
  let got = 0;
  const timer = setTimeout(() => { if (got < 2) setStatus("Når inte den delade lagringen än – det du ser kan vara gammalt", "bad"); }, 10000);
  const done = () => { if (++got === 2) { clearTimeout(timer); STORE.loaded = true; setStatus(STORE.canWrite ? "" : "Du kan titta men inte spara", STORE.canWrite ? "" : "bad"); storeChanged("all"); } };
  let firstL = true, firstG = true;

  db.collection("levels").onSnapshot(snap => {
    for (const ch of snap.docChanges()) {
      const name = ch.doc.id;
      if (ch.type === "removed") { delete STORE.levels[name]; storeChanged({ level: name, removed: true }); continue; }
      const d = ch.doc.data();
      if (!d || typeof d.json !== "string") continue;
      if (d.sid === STORE.sid && STORE.levels[name]) continue;   // mitt eget eko
      try { STORE.levels[name] = { data: JSON.parse(d.json), by: d.by || null, at: d.at || 0 }; } catch { continue; }
      if (!firstL) storeChanged({ level: name, by: d.by });
    }
    if (firstL && !snap.metadata.fromCache) { firstL = false; done(); }
    storeChanged("levels");
  }, e => { setStatus("Den delade lagringen svarar inte", "bad"); clearTimeout(timer); });

  db.collection("graphics").onSnapshot(snap => {
    for (const ch of snap.docChanges()) {
      const name = ch.doc.id;
      if (ch.type === "removed") { delete STORE.graphics[name]; unregisterGraphic(name); continue; }
      const d = ch.doc.data();
      if (!d || typeof d.png !== "string" || !d.png.startsWith("data:image/png")) continue;
      const g = { name, w: +d.w || 16, h: +d.h || 16, png: d.png, by: d.by || null, at: d.at || 0 };
      const old = STORE.graphics[name];
      if (old && old.png === g.png) continue;
      STORE.graphics[name] = g; registerGraphic(g);
    }
    if (firstG && !snap.metadata.fromCache) { firstG = false; done(); }
    storeChanged("graphics");
  }, e => { clearTimeout(timer); });

  if (room) {
    STORE.room = room;
    room.on("edit", msg => {
      if (msg.isMe && msg.sameTab) return;
      const d = msg.data;
      if (!d || typeof d.lvl !== "string" || !Array.isArray(d.ops)) return;
      if (typeof ED !== "undefined") ED.remoteOps(d.lvl, d.ops, msg.peer);
    });
    room.onPeers(ch => {
      STORE.peers = ch.peers.filter(p => !p.sameTab && p.kind === "viewer");
      const ids = STORE.peers.map(p => p.by || (p.presence && p.presence.id)).filter(Boolean);
      if (ids.length && user) user.profiles(ids).then(ps => { STORE.profiles = ps; storeChanged("peers"); });
      storeChanged("peers");
    });
  }
}

}

function allFlags() {
  const map = new Map();
  const add = (name, where, set) => {
    name = (name || "").trim().toLowerCase(); if (!name) return;
    if (!map.has(name)) map.set(name, { name, sets: [], needs: [] });
    const m = map.get(name); (set ? m.sets : m.needs).push(where);
  };
  for (const n of levelNames()) {
    const L = n === ED.name && ED.L ? ED.L : getLevel(n); if (!L) continue;
    const lname = L.displayName || n;
    for (const o of L.objects || []) {
      const who = (getP(o, "NPC.speakerName") || o.id || objDef(o.type).name) + ` (${lname})`;
      add(getP(o, "NPC.setFlag"), who, true); add(getP(o, "EventZone.setFlag"), who, true);
      add(getP(o, "NPC.requireFlag"), who, false); add(getP(o, "EventZone.requireFlag"), who, false);
    }
    if (n === "hemma" && !STORE.levels.hemma) { /* mamma i originalbanan */ }
  }
  return [...map.values()].sort((a, b) => a.name.localeCompare(b.name, "sv"));
}

const FIGGEN = (() => {
  const A = c => c & 255, R = c => c >>> 24, Gc = c => (c >>> 16) & 255, B = c => (c >>> 8) & 255;

  if (num("damage")) p.damage = Math.round(num("damage"));
  if (num("range")) p.range = num("range");
  if (num("cooldown")) p.cooldown = num("cooldown");
  if (num("heal")) p.heal = Math.round(num("heal"));
  const eff = g("effect"); if (eff && eff !== "Standard") p.effect = eff;
  if (num("effectTime")) p.effectTime = num("effectTime");
  const c = g("consumed"); if (c === "Ja") p.consumed = true; else if (c === "Nej") p.consumed = false;
  const a = g("ammo"); if (a && a.trim()) p.ammo = a.trim() === "-" ? "" : a.trim();
  if (["Skjut", "Magi", "Kasta"].includes(p.kind)) { if (p.range <= 0) p.range = 6; if (p.damage <= 0) p.damage = 1; }
  if (["Svep", "Stöt", "Slag"].includes(p.kind)) { if (p.range <= 0) p.range = 1; if (p.damage <= 0) p.damage = 1; }
  if (p.kind === "Bomb") { if (p.range <= 0) p.range = 1.5; if (p.damage <= 0) p.damage = 2; }
  if ((p.kind === "Drick" || p.kind === "Ät") && p.heal <= 0 && p.effect === "Ingen") p.heal = 1;

const propsKey = p => [p.kind, p.damage, p.range, p.cooldown, p.heal, p.effect, p.effectTime, p.consumed, p.ammo].join("|");

// ----------------------------------------------------------------------------- ryggsäcken
function invEntries() { return G.inv.entries; }
function invCount(id) { return G.inv.entries.filter(e => e.id === id).reduce((s, e) => s + e.count, 0); }
function invUsable() { return G.inv.entries.filter(e => e.count > 0 && usable(e.props)); }
function invSelected(p = G.player) { const u = invUsable(); return u.length && p ? u[clamp(p.sel, 0, u.length - 1)] : null; }
function invSelect(p, e) { const i = invUsable().indexOf(e); if (i >= 0) p.sel = i; }
function invAdd(id, amount, props, announce, who) {
  props = props || itemDefaults(id);
  const k = propsKey(props);
  let e = G.inv.entries.find(x => x.id === id && propsKey(x.props) === k);
  if (!e) { e = { id, props, count: 0 }; G.inv.entries.push(e); }
  e.count += amount;
  if (announce) {
    const name = ITEMS[id] ? ITEMS[id].name : id;
    if (usable(props)) {
      const u = invUsable(), p = who || G.player;
      if (!invSelected(p) || u.length === 1) p.sel = u.indexOf(e);
      showMessage(`Du fick: ${name}! ${touch.seen ? "Tryck B" : "Tryck K"} för att använda${u.length > 1 ? (touch.seen ? ", ⇄ byter" : ", Q byter") : ""}.`, 4);
    } else showMessage("Du fick: " + name);
  }
}
function invRemove(id, amount = 1) {
  for (const e of G.inv.entries) { if (e.id !== id || amount <= 0) continue; const t = Math.min(amount, e.count); e.count -= t; amount -= t; }
  G.inv.entries = G.inv.entries.filter(e => e.count > 0);
  clampSel();
}
function clampSel() { const n = Math.max(0, invUsable().length - 1); for (const p of G.players) p.sel = clamp(p.sel, 0, n); }
function invTakeOne(e) {
  e.count--;
  G.inv.entries = G.inv.entries.filter(x => x.count > 0);
  clampSel();
}
function invCycle(p) {
  const u = invUsable(); if (!u.length) return;
  p.sel = (p.sel + 1) % u.length;
  const e = u[p.sel]; showMessage(ITEMS[e.id] ? ITEMS[e.id].name : e.id, 1.2);
}

// ----------------------------------------------------------------------------- effekter
const speedMul = (p = G.player) => (G.time < (p.speedUntil || 0) ? 1.6 : 1);
const strengthMul = (p = G.player) => (G.time < (p.strengthUntil || 0) ? 2 : 1);
const shielded = (p = G.player) => G.time < (p.shieldUntil || 0);
const EFFECT_COLORS = { Snabbhet: "#7fd9ff", Skydd: "#fff3a0", Styrka: "#ff6a5a" };

function fxPx(x, y) { return { x: (x - view.x0) * PPU, y: (view.y1 - y) * PPU }; }
function addFx(f) { f.t = 0; G.fx.push(f); return f; }
function burst(x, y, color, n, speed, life, gravity = 0) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = speed * (0.5 + Math.random() * 0.5);
    addFx({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (0.7 + Math.random() * 0.5), color, g: gravity, size: 1 + (Math.random() < 0.4 ? 1 : 0),
      update(dt) { this.vy -= this.g * dt; this.x += this.vx * dt; this.y += this.vy * dt; },
      draw() { const p = fxPx(this.x, this.y); view.ctx.globalAlpha = 1 - this.t / this.life; view.ctx.fillStyle = this.color; view.ctx.fillRect(Math.round(p.x), Math.round(p.y), this.size, this.size); view.ctx.globalAlpha = 1; } });
  }
}
function shock(x, y, radius, color, life) {
  addFx({ x, y, life, draw() {
    const k = this.t / this.life, p = fxPx(this.x, this.y), r = (0.1 + (radius - 0.1) * k) * PPU;
    const c = view.ctx; c.globalAlpha = 1 - k; c.strokeStyle = color; c.lineWidth = 2;
    c.beginPath(); c.ellipse(p.x, p.y, r, r * 0.7, 0, 0, Math.PI * 2); c.stroke(); c.globalAlpha = 1;
  } });
}
function riseHeart(x, y) { addFx({ x, y, life: 0.9, draw() { drawSprite("Items/heart_full", this.x, this.y + this.t * 0.8, { alpha: 1 - this.t / this.life, scale: 0.7 }); } }); }
function held(key, life, pos, extra = {}) {   // föremålet som syns i handen under animationen
  return addFx(Object.assign({ key, life, pos, draw() { const q = this.pos(this.t / this.life, this); if (q) drawSprite(this.key, q.x, q.y, { rot: q.rot || 0, scale: q.s || 1, alpha: q.a }); } }, extra));
}
let shakeUntil = 0, shakeAmt = 0;
function shake(t, a) { shakeUntil = G.time + t; shakeAmt = a; }

// skada allt i en cirkel (utom spelaren och vänliga personer)
function hitArea(cx, cy, r, dmg, dir) {
  let n = 0;
  for (const e of G.entities) {
    if (e.dead || !e.hurt) continue;
    if (e.kind === "npc" && !e.hostile) continue;
    const b = body(e);
    if (!circleBox(cx, cy, r, { x0: b.x0, x1: b.x1, y0: b.y0, y1: b.y1 + 0.5 })) continue;
    const d = dir || (() => { const dx = e.x - cx, dy = e.y - cy, m = Math.hypot(dx, dy) || 1; return { x: dx / m, y: dy / m }; })();
    e.hurt(d, dmg); n++;
  }
  return n;
}
function friendlyAt(x, y) {
  for (const e of G.entities) if (!e.dead && e.kind === "npc" && !e.hostile) { const b = body(e); if (circleBox(x, y, 0.2, { x0: b.x0, x1: b.x1, y0: b.y0, y1: b.y1 + 0.6 })) return true; }
  for (const e of G.entities) if (!e.dead && e.solid && !e.hurt && e.kind !== "player") { const b = body(e); if (circleBox(x, y, 0.1, b)) return true; }
  return false;
}
function projectile(key, x, y, dir, p, speed, opts = {}) {
  return addFx({ key, x, y, dir, speed, dmg: p.damage * strengthMul(opts.who), max: p.range, gone: 0, life: 99, rot: opts.rot || 0, spin: opts.spin || 0, trail: opts.trail, glow: opts.glow,
    update(dt) {
      const s = this.speed * dt; this.x += this.dir.x * s; this.y += this.dir.y * s; this.gone += s; this.rot += this.spin * dt;
      if (this.trail && Math.random() < 0.6) burst(this.x, this.y, this.trail, 1, 0.4, 0.3);
      const hit = hitArea(this.x, this.y, 0.3, this.dmg, this.dir);
      if (hit || solidTile(Math.floor(this.x), Math.floor(this.y - 0.2)) || friendlyAt(this.x, this.y) || this.gone >= this.max) {
        burst(this.x, this.y, this.trail || "#ffffff", 6, 2, 0.25); this.t = this.life;
