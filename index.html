    },
    draw() {
      if (this.glow) { const p = fxPx(this.x, this.y), c = view.ctx; c.globalAlpha = 0.45; c.fillStyle = this.glow; c.beginPath(); c.arc(p.x, p.y, 4, 0, Math.PI * 2); c.fill(); c.globalAlpha = 1; c.fillStyle = "#fff"; c.fillRect(Math.round(p.x) - 1, Math.round(p.y) - 1, 2, 2); }
      else drawSprite(this.key, this.x, this.y - 0.3, { rot: this.rot });
    } });
}

// ----------------------------------------------------------------------------- använda
function updateItemUse(p, canAct, use, cyc) {
  if (!canAct) return;
  if (cyc) invCycle(p);
  if (!use) return;
  const e = invSelected(p);
  if (!e) { showMessage("Du har inget att använda än.", 1.5); return; }
  if (G.time < (p.nextUse || 0) || G.time < p.frozenUntil) return;
  const pr = e.props;
  if (pr.ammo) {
    if (invCount(pr.ammo) <= 0) { showMessage(`Du behöver ${(ITEMS[pr.ammo] ? ITEMS[pr.ammo].name : pr.ammo).toLowerCase()}.`, 1.5); return; }
    invRemove(pr.ammo, 1);
  }
  p.nextUse = G.time + Math.max(0.1, pr.cooldown);
  const icon = ITEMS[e.id] ? ITEMS[e.id].icon : "Items/potion";
  const ammoIcon = pr.ammo && ITEMS[pr.ammo] ? ITEMS[pr.ammo].icon : icon;
  if (pr.consumed) invTakeOne(e);
  useItem(p, pr, icon, ammoIcon);
}

function useItem(p, pr, icon, ammoIcon) {
  const f = { x: p.facing.x, y: p.facing.y }, ang = Math.atan2(f.y, f.x);
  const cx = () => p.x, cy = () => p.y + 0.55;
  const freeze = t => { p.frozenUntil = Math.max(p.frozenUntil, G.time + t); };
  const dmg = Math.max(1, pr.damage) * strengthMul(p);
  const rotFor = a => -(a - Math.PI / 4);   // ikonerna är ritade snett uppåt höger
  switch (pr.kind) {
    case "Svep": {
      freeze(0.2); let hit = false;
      held(icon, 0.18, (k) => {
        const a = ang + (75 - 150 * k) * Math.PI / 180, r = 0.45 + pr.range * 0.3;
        if (!hit && k > 0.4) { hit = true; const hx = cx() + f.x * Math.max(0.6, pr.range), hy = cy() + f.y * Math.max(0.6, pr.range); spawnSlash(hx, hy, f); hitArea(hx, hy, 0.45 + pr.range * 0.15, dmg, f); }
        return { x: cx() + Math.cos(a) * r, y: cy() + Math.sin(a) * r - 0.3, rot: rotFor(a) };
      });
      break;
    }
    case "Stöt": {
      freeze(0.22); let hit = false;
      held(icon, 0.22, (k) => {
        const out = k < 0.45 ? k / 0.45 : 1 - (k - 0.45) / 0.55;
        if (!hit && k >= 0.45) { hit = true; for (let d = 0.4; d <= pr.range + 0.3; d += 0.4) hitArea(cx() + f.x * d, cy() + f.y * d, 0.35, dmg, f); burst(cx() + f.x * (pr.range + 0.3), cy() + f.y * (pr.range + 0.3), "#ffffff", 4, 2, 0.2); }
        return { x: cx() + f.x * (0.3 + pr.range * out), y: cy() + f.y * (0.3 + pr.range * out) - 0.3, rot: rotFor(ang) };
      });
      break;
    }
    case "Slag": {
      freeze(0.45); let hit = false;
      held(icon, 0.4, (k) => {
        if (k < 0.5) return { x: cx(), y: cy() + 0.4 + k * 0.4, rot: rotFor(Math.PI / 2), s: 1.1 };
        const ix = cx() + f.x * 0.8, iy = cy() + f.y * 0.8;
        if (!hit) {
          hit = true; hitArea(ix, iy, pr.range, dmg, null);
          shock(ix, iy - 0.3, pr.range, "#fff7d0", 0.3); burst(ix, iy - 0.3, "#c0a880", 10, 2.5, 0.35, 4); shake(0.15, 1.5);
        }
        const kk = Math.min(1, (k - 0.5) / 0.15);
        return { x: cx() + f.x * 0.8 * kk, y: cy() + 0.6 - 0.6 * kk + f.y * 0.8 * kk - 0.3, rot: rotFor(ang), s: 1.1 };
      });
      break;
    }
    case "Skjut": {
      freeze(0.15);
      held(icon, 0.15, () => ({ x: cx() + f.x * 0.4, y: cy() + f.y * 0.4 - 0.3, rot: rotFor(ang) }));
      projectile(ammoIcon, cx() + f.x * 0.4, cy() + f.y * 0.4, f, pr, 11, { rot: rotFor(ang), who: p });
      break;
    }
    case "Kasta":
      freeze(0.12);
      projectile(icon, cx() + f.x * 0.4, cy() + f.y * 0.4, f, pr, 8, { spin: 16, who: p });
      break;
    case "Magi": {
      freeze(0.25);
      held(icon, 0.25, () => ({ x: cx() + f.x * 0.35, y: cy() + f.y * 0.35 - 0.1 }));
      burst(cx() + f.x * 0.35, cy() + 0.2, "#c08cff", 8, 1.5, 0.3);
      setTimeout(() => projectile(null, cx() + f.x * 0.45, cy() + f.y * 0.45, f, pr, 7, { trail: "#c08cff", glow: "#c08cff", who: p }), 120);
      break;
    }
    case "Bomb": {
      const bx = p.x + f.x * 0.5, by = p.y + f.y * 0.5;
      addFx({ life: 1.6, x: bx, y: by,
        draw() { const k = this.t / this.life, sp = 4 + 18 * k; drawSprite(icon, this.x, this.y, { scale: 1 + Math.max(0, k - 0.8), alpha: 1 }); if (Math.sin(this.t * sp) > 0) { const q = fxPx(this.x, this.y + 0.4); view.ctx.globalAlpha = 0.5; view.ctx.fillStyle = "#ff6060"; view.ctx.beginPath(); view.ctx.arc(q.x, q.y, 6, 0, Math.PI * 2); view.ctx.fill(); view.ctx.globalAlpha = 1; } },
        done() {
          const ex = this.x, ey = this.y + 0.3;
          hitArea(ex, ey, pr.range, dmg, null);
          shock(ex, ey, pr.range, "#ffe08a", 0.35); burst(ex, ey, "#ff9a30", 18, 4, 0.45); burst(ex, ey, "#777777", 10, 1.5, 0.8, -1); shake(0.25, 2.5);
        } });
      break;
    }
    case "Drick":
      freeze(0.75);
      held(icon, 0.7, (k) => { if (Math.random() < 0.25) burst(cx(), cy() + 0.1, "#9fe4ff", 1, 0.8, 0.4, -1.5); return { x: cx(), y: cy() + 0.4, rot: -Math.min(1, k / 0.7) * 2.2 }; }, { done: () => finishItem(p, pr) });
      break;
    case "Ät":
      freeze(0.7);
      held(icon, 0.65, (k, fx) => {
        const bite = Math.min(3, Math.floor(k * 3.3));
        if (bite !== fx.bite) { fx.bite = bite; if (bite > 0) burst(cx() + f.x * 0.25, cy() - 0.1, "#e6c080", 4, 1.2, 0.35, 5); }
        return { x: cx() + f.x * 0.25, y: cy() - 0.15, s: 1 - bite * 0.28 };
      }, { done: () => finishItem(p, pr) });
      break;
    case "Förstärk":
      freeze(0.6);
      held(icon, 0.55, (k) => { if (Math.random() < 0.4) burst(cx(), cy() + 0.6, EFFECT_COLORS[pr.effect] || "#fff", 1, 1.5, 0.4); return { x: cx(), y: cy() + 0.45 + Math.sin(k * 20) * 0.05 }; }, { done: () => finishItem(p, pr) });
      break;
  }
}

function finishItem(p, pr) {
  if (pr.heal > 0) {
    p.hp = Math.min(p.maxHp, p.hp + pr.heal);
    const n = Math.min(pr.heal, 5);
    for (let i = 0; i < n; i++) riseHeart(p.x + (i - (n - 1) / 2) * 0.35, p.y + 1.3);
  }
  if (pr.effect && pr.effect !== "Ingen" && pr.effect !== "Standard" && pr.effectTime > 0) {
    const until = G.time + pr.effectTime;
    if (pr.effect === "Snabbhet") { p.speedUntil = until; showMessage(`Snabbhet i ${Math.round(pr.effectTime)} sekunder!`, 1.5); }
    if (pr.effect === "Skydd") { p.shieldUntil = until; showMessage(`Skydd i ${Math.round(pr.effectTime)} sekunder!`, 1.5); }
    if (pr.effect === "Styrka") { p.strengthUntil = until; showMessage(`Dubbel styrka i ${Math.round(pr.effectTime)} sekunder!`, 1.5); }
  }
}

function updateFx(dt) {
  for (const f of G.fx) {
    f.t += dt;
    if (f.update) f.update(dt);
    if (f.t >= f.life && !f.ended) { f.ended = true; if (f.done) f.done(); }
  }
  G.fx = G.fx.filter(f => !f.ended);
  for (const p of G.players) if (G.time < (p.speedUntil || 0) && Math.random() < 0.3) burst(p.x, p.y + 0.2, EFFECT_COLORS.Snabbhet, 1, 0.3, 0.3);
}
function drawFx() { for (const f of G.fx) if (!f.ended) f.draw && f.draw(); }
function drawAura(p) {
  const eff = shielded(p) ? "Skydd" : G.time < (p.strengthUntil || 0) ? "Styrka" : G.time < (p.speedUntil || 0) ? "Snabbhet" : null;
  if (!eff) return;
  const q = fxPx(p.x, p.y + 0.6), c = view.ctx;
  c.globalAlpha = 0.25 + 0.2 * Math.sin(G.time * 10);
  c.fillStyle = EFFECT_COLORS[eff];
  c.beginPath(); c.ellipse(q.x, q.y, 10, 13, 0, 0, Math.PI * 2); c.fill();
  c.globalAlpha = 1;
}
function shakeOffset() { return SETTINGS.shake && G.time < shakeUntil ? { x: (Math.random() - 0.5) * shakeAmt, y: (Math.random() - 0.5) * shakeAmt } : { x: 0, y: 0 }; }

// ============================================================================
//  HANDKONTROLL, COOP PÅ SAMMA SKÄRM, BOSSAR OCH FÖREMÅLSSKÄRMEN
//  Handkontroll (Xbox-layout): A hugg/prata, X använd, Y byt, Start föremålsskärm, B tillbaka
//  Spelare 2 går med genom att trycka Start på en ledig handkontroll, Back lämnar.
// ============================================================================

// ----------------------------------------------------------------------------- tangentbord (köer)
let useQueued = false, cycleQueued = false, menuQueued = false, backQueued = false;
addEventListener("keydown", e => {
  if (ED.active || isTyping(e) || e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === "k" || k === "x") useQueued = true;
  if (k === "q" || k === "tab") { cycleQueued = true; if (k === "tab") e.preventDefault(); }
  if (k === "i") menuQueued = true;
  if (k === "escape" || k === "backspace") backQueued = true;
});

// ----------------------------------------------------------------------------- handkontroller
const PADS = [];          // per handkontroll: { buttons: [bool], prev: [bool], axes }
let p1Pad = -1;           // den kontroll spelare 1 senast använde
const B = { A: 0, B: 1, X: 2, Y: 3, Back: 8, Start: 9, Up: 12, Down: 13, Left: 14, Right: 15 };
function pollPads() {
  const list = navigator.getGamepads ? navigator.getGamepads() : [];
  for (let i = 0; i < 4; i++) {
    const gp = list[i];
    const s = PADS[i] || (PADS[i] = { buttons: [], prev: [], axes: [0, 0], connected: false });
    s.prev = s.buttons;
    s.connected = !!gp;
    s.buttons = gp ? gp.buttons.map(b => b.pressed || b.value > 0.5) : [];
    s.axes = gp ? [gp.axes[0] || 0, gp.axes[1] || 0] : [0, 0];
  }
}
const padDown = (i, b) => !!(PADS[i] && PADS[i].buttons[b] && !PADS[i].prev[b]);
function padStick(i) {
  const s = PADS[i]; if (!s || !s.connected) return { x: 0, y: 0 };
  let x = s.axes[0], y = -s.axes[1];
  if (Math.hypot(x, y) < 0.25) { x = 0; y = 0; }
  if (s.buttons[B.Left]) x = -1; if (s.buttons[B.Right]) x = 1;
  if (s.buttons[B.Up]) y = 1; if (s.buttons[B.Down]) y = -1;
  return { x, y };
}
const ownsPad = (pi, i) => (pi === 0 ? i !== G.p2pad : i === G.p2pad);
function padAny(pi, b) { for (let i = 0; i < 4; i++) if (ownsPad(pi, i) && padDown(i, b)) { if (pi === 0) p1Pad = i; return true; } return false; }

// ----------------------------------------------------------------------------- inmatning per spelare och bild
const IN = [{ move: { x: 0, y: 0 } }, { move: { x: 0, y: 0 } }];
const navState = [{ d: "", next: 0 }, { d: "", next: 0 }];
G.p2pad = -1;
function readInput() {
  pollPads();
  for (let pi = 0; pi < 2; pi++) {
    let mv = pi === 0 ? inputMove() : { x: 0, y: 0 };
    for (let i = 0; i < 4; i++) {
      if (!ownsPad(pi, i)) continue;
      const s = padStick(i);
      if (Math.hypot(s.x, s.y) > Math.hypot(mv.x, mv.y)) { mv = s; if (pi === 0) p1Pad = i; }
    }
    const kb = pi === 0;
    IN[pi] = {
      move: mv,
      action: (kb && actionQueued) || padAny(pi, B.A),
      use: (kb && useQueued) || padAny(pi, B.X),
      cycle: (kb && cycleQueued) || padAny(pi, B.Y),
      menu: (kb && menuQueued) || (pi === 1 || G.p2 ? padAny(pi, B.Start) : (p1Pad >= 0 && padDown(p1Pad, B.Start))),
      back: (kb && backQueued) || padAny(pi, B.B),
      leave: pi === 1 && G.p2pad >= 0 && padDown(G.p2pad, B.Back),
      nav: nav(pi, mv),
    };
  }
  action = IN[0].action || IN[1].action;
  actionQueued = useQueued = cycleQueued = menuQueued = backQueued = false;
}
function nav(pi, mv) {   // en ruta i taget, upprepas om man håller kvar
  const st = navState[pi];
  const d = Math.abs(mv.x) > 0.5 ? (mv.x > 0 ? "r" : "l") : Math.abs(mv.y) > 0.5 ? (mv.y > 0 ? "u" : "d") : "";
  const now = performance.now();
  if (!d) { st.d = ""; return ""; }
  if (d !== st.d) { st.d = d; st.next = now + 350; return d; }

}

// ----------------------------------------------------------------------------- coop
function nearestPlayer(x, y) {
  let best = null, bd = 1e9;
  for (const p of G.players) { if (p.dead) continue; const d = dist(p.x, p.y, x, y); if (d < bd) { bd = d; best = p; } }
  return best || G.player;
}
function spotNextTo(p) {
  for (const [dx, dy] of [[0.8, 0], [-0.8, 0], [0, -0.8], [0, 0.8]]) {
    const t = { x: p.x + dx, y: p.y + dy, col: p.col };
    if (!blocked(t, t.x, t.y)) return { x: t.x, y: t.y };
  }
  return { x: p.x, y: p.y };
}
function placeP2() {
  const p2 = G.p2; if (!p2 || !G.players.includes(p2)) return;
  const s = spotNextTo(G.player);
  p2.x = s.x; p2.y = s.y; p2.facing = { ...G.player.facing }; p2.knockUntil = 0;
  if (p2.dead) { p2.dead = false; p2.hp = p2.maxHp; }
}
function keepNearOther(p, ox, oy) {   // man kan inte springa ifrån varandra utanför skärmen
  const o = G.players.find(q => q !== p && !q.dead);
  if (!o || p.dead) return;
  const maxX = view.wU - 1.2, maxY = view.hU - 1.8;
  if (Math.abs(p.x - o.x) > maxX && Math.abs(p.x - o.x) > Math.abs(ox - o.x)) p.x = ox;
  if (Math.abs(p.y - o.y) > maxY && Math.abs(p.y - o.y) > Math.abs(oy - o.y)) p.y = oy;
}
function updateCoop() {
  if (G.busy) return;
  if (!G.p2) {
    for (let i = 0; i < 4; i++) if (i !== p1Pad && padDown(i, B.Start)) { joinP2(i); return; }
    // bara en kontroll och spelare 1 kör med tangentbordet: den kontrollen får gå med
  } else if (IN[1].leave) leaveP2();
}
function joinP2(pad) {

  G.p2 = makePlayer(1);
  G.players = [G.player, G.p2];

  showMessage("Spelare 2 är med! (Back på kontrollen lämnar)", 3);
}

}

// ============================================================================
//  INTRO: Fettokisse Gamestudio, sedan PONTLIFE med skog, slott, svärd och glitter
//  Samma bilder och tidslinje som i Unity (Sprites/Splash). Tryck på något för att hoppa fram.
// ============================================================================
const SPLASH = { on: false, t: 0, phase: "studio", sceneT: 0, done: false, last: 0, fireflies: [] };
const splashCanvas = document.getElementById("splash");
const sctx = splashCanvas.getContext("2d");
const STUDIO_LEN = 3.2, VW = 256, VH = 224;

function startSplash() {
  SPLASH.on = true; SPLASH.t = 0; SPLASH.phase = "studio"; SPLASH.sceneT = 0; SPLASH.done = false;
  if (!SETTINGS.intro) { SPLASH.phase = "scene"; SPLASH.sceneT = 6; SPLASH.done = true; setTimeout(() => openMenu("main"), 50); }
  SPLASH.fireflies = Array.from({ length: 14 }, () => ({ x: Math.random() * VW, y: 150 + Math.random() * 60, p: Math.random() * 6 }));
  document.getElementById("intro").hidden = true;
  splashCanvas.hidden = false;
  requestAnimationFrame(splashLoop);
}
function splashSkip() {
  if (!SPLASH.on) return;
  if (SPLASH.phase === "studio") { SPLASH.phase = "scene"; SPLASH.sceneT = 2.2; return; }
  if (!SPLASH.done && SPLASH.sceneT < 4.6) { SPLASH.sceneT = 4.6; return; }
  if (!SPLASH.done) { SPLASH.done = true; openMenu("main"); }
}
function showIntroOverSplash() {
  const intro = document.getElementById("intro");
  intro.classList.add("over-splash");
  intro.hidden = false;
}
function stopSplash() { SPLASH.on = false; splashCanvas.hidden = true; }
function resumeSplash() {   // tillbaka till startsidan: scenen rullar vidare i bakgrunden
  SPLASH.on = true; SPLASH.phase = "scene"; SPLASH.done = true; SPLASH.sceneT = Math.max(SPLASH.sceneT, 6);
  splashCanvas.hidden = false;
  requestAnimationFrame(splashLoop);
}
for (const ev of ["keydown", "pointerdown"]) addEventListener(ev, e => {
  if (!SPLASH.on || SPLASH.done || MENU.open) return;
  if (e.target && e.target.closest && e.target.closest("#intro")) return;
  splashSkip();
});

const ease = t => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);

function splashLoop(ts) {
  if (!SPLASH.on) return;
  requestAnimationFrame(splashLoop);
  const dt = Math.min(0.05, (ts - SPLASH.last) / 1000 || 0); SPLASH.last = ts;
  SPLASH.t += dt;
  if (SPLASH.phase === "studio" && SPLASH.t > STUDIO_LEN) SPLASH.phase = "scene";
  if (SPLASH.phase === "scene") SPLASH.sceneT += dt;
  // handkontroll: valfri knapp hoppar fram
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let any = false;
  for (const gp of pads) if (gp) for (const b of gp.buttons) if (b.pressed) any = true;
  if (any && !SPLASH.padHeld && !MENU.open) splashSkip();
  SPLASH.padHeld = any;

  const dpr = Math.min(3, devicePixelRatio || 1);
  const cw = Math.round(splashCanvas.clientWidth * dpr), ch = Math.round(splashCanvas.clientHeight * dpr);
  if (splashCanvas.width !== cw || splashCanvas.height !== ch) { splashCanvas.width = cw; splashCanvas.height = ch; }
  const k = ch / VH;                     // skala: hela höjden
  const ox = (cw - VW * k) / 2;          // mitten
  const g = sctx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.imageSmoothingEnabled = false;
  g.fillStyle = "#000"; g.fillRect(0, 0, cw, ch);
  const draw = (key, x, y, opt = {}) => {
    const im = IMG["Splash/" + key]; if (!im || !im.width) return;
    const s = (opt.s || 1) * k;
    g.globalAlpha = opt.a === undefined ? 1 : Math.max(0, Math.min(1, opt.a));
    const w = (opt.sw || im.width) * s, h = (opt.sh || im.height) * s;
    if (opt.center) g.drawImage(im, opt.sx || 0, opt.sy || 0, opt.sw || im.width, opt.sh || im.height, Math.round(ox + x * k - w / 2), Math.round(y * k - h / 2), Math.round(w), Math.round(h));
    else g.drawImage(im, opt.sx || 0, opt.sy || 0, opt.sw || im.width, opt.sh || im.height, Math.round(ox + x * k), Math.round(y * k), Math.round(w), Math.round(h));
    g.globalAlpha = 1;
  };
  // lager som rullar i sidled och fyller hela bredden
  const strip = (key, y, speed) => {
    const im = IMG["Splash/" + key]; if (!im || !im.width) return;
    const w = im.width * k, h = im.height * k;
    const off = ((SPLASH.sceneT * speed) % im.width) * k;
    let xx = (((ox - off) % w) + w) % w - w;
    for (; xx < cw; xx += w) g.drawImage(im, Math.round(xx), Math.round(y * k), Math.ceil(w) + 1, Math.round(h));
  };

  if (SPLASH.phase === "studio") {
    const t = SPLASH.t;
    const fade = t < 0.4 ? t / 0.4 : t > STUDIO_LEN - 0.6 ? (STUDIO_LEN - t) / 0.6 : 1;
    const drop = ease(t / 0.7), bounce = t < 0.7 ? 0 : Math.abs(Math.sin((t - 0.7) * 9)) * Math.max(0, 1 - (t - 0.7) * 2.5) * 6;
    const blink = (t > 1.5 && t < 1.62) || (t > 2.2 && t < 2.3);
    draw(blink ? "cat_1" : "cat_0", VW / 2, -30 + (92 - -30) * drop - bounce, { center: true, s: 2, a: fade });
    draw("studio_name", VW / 2, 140, { center: true, a: fade * Math.min(1, Math.max(0, (t - 0.7) / 0.5)) });
    draw("studio_sub", VW / 2, 160, { center: true, a: fade * Math.min(1, Math.max(0, (t - 1.1) / 0.5)) });
    return;
  }

  const t = SPLASH.sceneT;
  const pan = 70 * (1 - ease(t / 3.2));        // kameran åker uppåt
  // himmel (sträckt åt sidorna)
  const sky = IMG["Splash/sky"];
  if (sky && sky.width) {
    g.drawImage(sky, 0, 0, 1, VH, 0, Math.round(-pan * 0.2 * k), Math.round(ox) + 1, Math.round(VH * k));
    g.drawImage(sky, VW - 1, 0, 1, VH, Math.round(ox + VW * k) - 1, Math.round(-pan * 0.2 * k), Math.round(ox) + 2, Math.round(VH * k));
    g.drawImage(sky, Math.round(ox), Math.round(-pan * 0.2 * k), Math.round(VW * k), Math.round(VH * k));
  }
  // stjärnor som blinkar
  g.globalAlpha = 0.6 + 0.4 * Math.sin(t * 3);
  const st = IMG["Splash/stars"]; if (st && st.width) { for (let xx = ox - Math.ceil(ox / (VW * k)) * VW * k; xx < cw; xx += VW * k) g.drawImage(st, Math.round(xx), Math.round(-pan * 0.2 * k), Math.round(VW * k), Math.round(VH * k)); }
  g.globalAlpha = 1;
  strip("mountains", 96 + pan * 0.4, 1.5);
  draw("castle", VW / 2, 118 + pan * 0.6, { center: true });
  strip("forest_back", 128 + pan * 0.8, 4);
  g.globalAlpha = 0.8; strip("mist", 168 + pan * 0.9, 9); g.globalAlpha = 1;
  strip("forest_front", 150 + pan, 7);
  // eldflugor
  for (const f of SPLASH.fireflies) {
    f.p += dt; const x = (f.x + Math.sin(f.p * 0.7) * 10 + t * 3) % VW, y = f.y + pan + Math.sin(f.p * 1.3) * 6;

  }
  g.globalAlpha = 1;
  // titel och svärd
  const titleT = (t - 2.4) / 0.45, swordT = (t - 3.1) / 0.22;
  if (swordT > 0) draw("sword", VW / 2, -60 + (64 + 60) * ease(swordT), { center: true });
  if (titleT > 0) {
    const s = 1 + 1.6 * (1 - ease(titleT));
    draw("title", VW / 2, 62, { center: true, s, a: ease(titleT) });
  }
  // blixt när svärdet slår ner
  if (swordT > 1 && swordT < 3) { g.fillStyle = `rgba(255,255,240,${0.7 * (1 - (swordT - 1) / 2)})`; g.fillRect(0, 0, cw, ch); }
  // glitter som sveper över titeln
  if (t > 3.8) {
    const c = ((t - 3.8) % 3) / 0.9;
    if (c < 1) {
      const frame = Math.floor(c * 12) % 4;
      draw("sparkle_" + frame, VW / 2 - 110 + 220 * c, 48 + Math.sin(c * 6) * 6, { center: true, s: 1.5 });
    }
    if (Math.floor(t * 2) % 7 === 0) draw("sparkle_" + Math.floor(t * 8) % 4, VW / 2 + 70, 46, { center: true });
  }
  // svart i början
  if (t < 1.2) { g.fillStyle = `rgba(0,0,0,${1 - t / 1.2})`; g.fillRect(0, 0, cw, ch); }
  if (!SPLASH.done && t > 4.6 && Math.floor(t * 2) % 2 === 0) draw("press", VW / 2, 206, { center: true });
}

// ============================================================================
//  MENYER: huvudmeny, pausmeny, spara/ladda (med autosparningar), inställningar och kontroller

// ----------------------------------------------------------------------------- inställningar
const SETTINGS_KEY = "pontlife.settings.v1";
const SETTINGS = Object.assign({ textSpeed: "Normal", shake: true, intro: true, touch: "Auto" }, (() => { try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}"); } catch { return {}; } })());

// ----------------------------------------------------------------------------- spara och ladda
const SAVE_KEY = "pontlife.saves.v1";
const SLOTS = 3, AUTO_KEEP = 6;
G.playTime = 0; G.removed = {};
function readSaves() { try { return Object.assign({ slots: [], auto: [] }, JSON.parse(localStorage.getItem(SAVE_KEY) || "{}")); } catch { return { slots: [], auto: [] }; } }
function writeSaves(s) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); return true; } catch { return false; } }
function snapshotGame() {
  const p = G.player;

    v: 1, at: Date.now(), level: G.levelName, levelTitle: (getLevel(G.levelName) || {}).displayName || G.levelName,
    playTime: Math.round(G.playTime), flags: [...G.flags],
    inv: { sword: G.inv.sword, gems: G.inv.gems, keys: G.inv.keys, entries: G.inv.entries.map(e => ({ id: e.id, props: e.props, count: e.count })) },
    players: G.players.map(q => ({ x: q.x, y: q.y, hp: q.dead ? q.maxHp : q.hp, maxHp: q.maxHp, sel: q.sel, fx: q.facing.x, fy: q.facing.y })),

const fmtTime = s => { const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60; return h ? `${h} h ${m} min` : `${m} min`; };

function screenSave() {

// ----------------------------------------------------------------------------- rita och styra
function openMenu(mode) {
  MENU.mode = mode || "main";
  MENU.open = true; MENU.stack = [];
  if (mode === "pause") G.paused = true;
  const intro = document.getElementById("intro");
  intro.classList.add("over-splash");
  intro.hidden = false;
  setScreen(screenMain);
}
function closeMenu(resume) {
  MENU.open = false;
  document.getElementById("intro").hidden = true;
  if (resume) G.paused = false;
}
function pushScreen(build) { MENU.stack.push({ build: MENU.build, index: MENU.index }); setScreen(build, false, 1); }
function popScreen() {
  const prev = MENU.stack.pop();
  if (!prev) { if (MENU.mode === "pause") closeMenu(true); return; }
  setScreen(prev.build, false, -1, prev.index);
}
function setScreen(build, keep, dir = 0, index) {
  const sc = build();
  MENU.build = build; MENU.cur = sc;
  if (!keep) MENU.index = index !== undefined ? index : 0;
  MENU.index = Math.min(MENU.index, sc.items.length - 1);
  while (sc.items[MENU.index] && (sc.items[MENU.index].disabled || sc.items[MENU.index].info) && MENU.index < sc.items.length - 1) MENU.index++;
  const root = menuRoot();
  root.innerHTML = "";
  root.classList.toggle("onsplash", MENU.mode !== "pause");
  const box = el("div", { class: "mbox " + (keep ? "" : dir < 0 ? "from-left" : dir > 0 ? "from-right" : "pop") });
  if (sc.title) box.append(el("h2", { class: "mtitle" }, sc.title));
  if (sc.note) box.append(el("p", { class: "mnote" }, sc.note));
  const list = el("div", { class: "mlist", role: "menu" });
  sc.items.forEach((it, i) => {
    const b = el("button", { class: "mitem" + (it.back ? " back" : "") + (it.info ? " info" : ""), role: "menuitem", disabled: it.disabled || undefined, style: `animation-delay:${keep ? 0 : 40 + i * 45}ms`,
      onmouseenter: () => { if (!it.disabled && !it.info) { MENU.index = i; markSel(); } },
      onclick: () => { if (it.disabled || it.info) return; MENU.index = i; activate(); } },
      el("span", { class: "mcur", "aria-hidden": "true" }),
      el("span", { class: "mlabel" }, it.label, it.sub ? el("small", {}, it.sub) : null),
      it.value ? el("span", { class: "mval" }, it.value) : null,
      it.arrow ? el("span", { class: "mval" }, "›") : null);
    list.append(b);
  });
  box.append(list);
  if (!sc.title || sc.logo) box.append(el("p", { class: "mfoot" }, "FETTOKISSE GAMESTUDIO"));
  root.append(box);
  markSel();
}
function markSel() {
  const items = MENU.root ? MENU.root.querySelectorAll(".mitem") : [];
  items.forEach((b, i) => b.classList.toggle("sel", i === MENU.index));
  const s = items[MENU.index]; if (s && s.scrollIntoView) s.scrollIntoView({ block: "nearest" });
}
function moveSel(d) {
  const its = MENU.cur.items; let i = MENU.index;
  for (let n = 0; n < its.length; n++) { i = (i + d + its.length) % its.length; if (!its[i].disabled && !its[i].info) break; }
  MENU.index = i; markSel();
}
function activate() {
  const it = MENU.cur.items[MENU.index];
  if (!it || it.disabled || it.info) return;
  const b = MENU.root.querySelectorAll(".mitem")[MENU.index];
  if (b) { b.classList.remove("press"); void b.offsetWidth; b.classList.add("press"); }
  setTimeout(() => it.act(), 90);
}
function menuBack() { if (MENU.stack.length) popScreen(); else if (MENU.mode === "pause") closeMenu(true); }

addEventListener("keydown", e => {
  if (!MENU.open || ED.active || STUDIO.open || isTyping(e)) {
    // Esc i spelet = paus
    if (!MENU.open && ready && !ED.active && !G.menu && !dialog.open && (e.key === "Escape" || e.key === "p" || e.key === "P")) { e.preventDefault(); openMenu("pause"); }
    return;
  }
  const k = e.key;
  if (["ArrowUp", "w", "W"].includes(k)) { e.preventDefault(); moveSel(-1); }
  else if (["ArrowDown", "s", "S"].includes(k)) { e.preventDefault(); moveSel(1); }
  else if (["Enter", " ", "e", "E", "j", "J"].includes(k)) { e.preventDefault(); activate(); }
  else if (["Escape", "Backspace"].includes(k)) { e.preventDefault(); menuBack(); }
}, true);

// handkontroll i menyn (egen loop eftersom spelet kan vara pausat)
const menuPad = { prev: [], navD: "", navNext: 0 };
function menuPadLoop() {
  requestAnimationFrame(menuPadLoop);
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const now = performance.now();
  let y = 0; const pressed = new Set();
  for (let i = 0; i < 4; i++) {
    const gp = pads[i]; if (!gp) continue;
    const ay = gp.axes[1] || 0;
    if (Math.abs(ay) > 0.5) y = ay > 0 ? 1 : -1;
    if (gp.buttons[12] && gp.buttons[12].pressed) y = -1;
    if (gp.buttons[13] && gp.buttons[13].pressed) y = 1;
    gp.buttons.forEach((b, j) => { if (b.pressed) pressed.add(i + ":" + j); });
  }
  const down = j => [...pressed].some(p => p.endsWith(":" + j) && !menuPad.prev.includes(p));
  const startBy = () => [...pressed].filter(p => p.endsWith(":9") && !menuPad.prev.includes(p)).map(p => +p.split(":")[0]);
  // Back på spelare 1:s kontroll = paus i spelet
  if (!MENU.open && ready && !ED.active && !G.menu && !dialog.open) {
    for (const p of pressed) if (p.endsWith(":8") && !menuPad.prev.includes(p) && +p.split(":")[0] !== G.p2pad) { menuPad.prev = [...pressed]; openMenu("pause"); return; }
  }
  if (MENU.open) {
    if (MENU.cur && MENU.cur.live && now - (menuPad.live || 0) > 1000) { menuPad.live = now; setScreen(MENU.build, true); }
    const d = y ? String(y) : "";
    if (!d) menuPad.navD = "";
    else if (d !== menuPad.navD) { menuPad.navD = d; menuPad.navNext = now + 350; moveSel(y); }
    else if (now > menuPad.navNext) { menuPad.navNext = now + 120; moveSel(y); }
    if (down(0)) activate();
    else if (down(1)) menuBack();
    else if (MENU.mode === "pause" && startBy().some(i => i !== G.p2pad)) closeMenu(true);
  }
  menuPad.prev = [...pressed];
}
requestAnimationFrame(menuPadLoop);

// ============================================================================
//  DELA OCH IMPORTERA – skicka banor via mail/AirDrop och läs in dem igen
//  Samma zip-format som Unity: Levels/<namn>.json och Grafik/<namn>.png
// ============================================================================

async function shareOrSave(filename, blob, title) {
  const file = new File([blob], filename, { type: blob.type || "application/octet-stream" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title });
      return true;
    }
  } catch (e) {
    if (e && e.name === "AbortError") return false;
  }
  return offerFile(filename, blob);
}

function graphicsUsedBy(L) {
  const out = new Set();
  const add = v => { if (typeof v === "string" && v.startsWith("egen/") && STORE.graphics[v.slice(5)]) out.add(v.slice(5)); };
  (L.palette || []).forEach(add);
  for (const o of L.objects || []) { add(o.type); for (const p of o.p || []) add(p.v); }
  return [...out];
}
function levelZip(names) {
  const enc = new TextEncoder(), files = [], gfx = new Set();
  for (const n of names) {
    const d = getLevel(n); if (!d) continue;
    files.push({ name: `Levels/${n}.json`, bytes: enc.encode(JSON.stringify(d, null, 2)) });
    graphicsUsedBy(d).forEach(g => gfx.add(g));
  }
  for (const g of gfx) files.push({ name: `Grafik/${g}.png`, bytes: dataUrlBytes(STORE.graphics[g].png) });
  return makeZip(files);
}
async function shareLevel(name) {
  if (ED.pending) await edSave();
  const title = (getLevel(name) || {}).displayName || name;
  const ok = await shareOrSave(`pontlife-${name}.zip`, levelZip([name]), "Pontlife-bana: " + title);
  if (ok) UI.toast("Banan är klar att skicka. Mottagaren väljer Meny → Importera.");
}
async function shareEverything() {
  if (ED.pending) await edSave();
  const enc = new TextEncoder(), files = [];
  for (const n of levelNames()) if (STORE.levels[n]) files.push({ name: `Levels/${n}.json`, bytes: enc.encode(JSON.stringify(getLevel(n), null, 2)) });
  for (const g of Object.values(STORE.graphics)) files.push({ name: `Grafik/${g.name}.png`, bytes: dataUrlBytes(g.png) });
  if (!files.length) { UI.toast("Inget eget att spara än – bygg något först."); return; }
  files.push({ name: "LÄSMIG.txt", bytes: enc.encode(
    "Pontlife – alla egna banor och bilder\r\n\r\n" +
    "Läsa in igen i webbappen: Meny → Importera och välj den här zip-filen.\r\n" +
    "Till Unity: packa upp i Assets/StreamingAssets så att Levels och Grafik hamnar där.\r\n") });
  const d = new Date(), stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const ok = await shareOrSave(`pontlife-allt-${stamp}.zip`, makeZip(files), "Pontlife – alla banor");
  if (ok) UI.toast("Klart! Spara filen i Filer eller maila den, så har du en säkerhetskopia.");
}

// ----------------------------------------------------------------------------- läsa zip
async function readZip(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf), out = [];
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 70000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error("Inte en zip-fil");
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder();
  for (let k = 0; k < count; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const off = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + xlen + clen;
    if (name.endsWith("/") || name.includes("__MACOSX")) continue;
    const start = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
    const raw = u8.subarray(start, start + csize);
    let bytes;
    if (method === 0) bytes = raw.slice();
    else if (method === 8 && typeof DecompressionStream !== "undefined") {
      const s = new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      bytes = new Uint8Array(await new Response(s).arrayBuffer());
    } else continue;
    out.push({ name, bytes });
  }
  return out;
}

// ----------------------------------------------------------------------------- importera
const bytesToDataUrl = (bytes, type) => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(new Blob([bytes], { type })); });
const imgSize = url => new Promise(res => { const i = new Image(); i.onload = () => res([i.width, i.height]); i.onerror = () => res(null); i.src = url; });

async function collectImport(files) {
  const levels = [], graphics = [], bad = [];
  const handle = async (name, bytes) => {
    const base = name.split("/").pop(), low = base.toLowerCase();
    if (low.endsWith(".json")) {
      try {
        const d = JSON.parse(new TextDecoder().decode(bytes));
        if (!(d.width > 0 && d.height > 0 && Array.isArray(d.ground))) throw 0;
        const key = slug(base.replace(/\.json$/i, "")) || "bana";
        levels.push({ name: key, data: validateLevel(d) });
      } catch { bad.push(base); }
    } else if (low.endsWith(".png")) {
      let key = slug(base.replace(/\.png$/i, ""));
      if (!/^(figur|foremal|objekt|mark|hinder)_/.test(key)) key = "objekt_" + key;
      const url = await bytesToDataUrl(bytes, "image/png"), sz = await imgSize(url);
      if (!sz) { bad.push(base); return; }
      const fig = kindOf(key) === "figur";
      graphics.push({ name: key, w: fig ? Math.floor(sz[0] / 3) : sz[0], h: fig ? Math.floor(sz[1] / 4) : sz[1], png: url });
    }
  };
  for (const f of files) {
    const buf = await f.arrayBuffer();
    if (/\.zip$/i.test(f.name) || f.type.includes("zip")) {
      try { for (const e of await readZip(buf)) await handle(e.name, e.bytes); }
      catch { bad.push(f.name); }
    } else await handle(f.name, new Uint8Array(buf));
  }
  return { levels, graphics, bad };
}
function pickImportFiles() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.multiple = true;
  inp.accept = ".zip,.json,.png,application/zip,application/json,image/png";
  inp.style.display = "none";
  inp.onchange = async () => {
    const files = [...inp.files]; inp.remove();
    if (!files.length) return;
    const r = await collectImport(files);
    if (!r.levels.length && !r.graphics.length) { UI.toast("Hittade inga banor eller bilder i filen."); return; }
    const replaced = r.levels.filter(l => STORE.levels[l.name] || LEVELS[l.name]).map(l => (l.data.displayName || l.name));
    const body = el("div", {},
      el("p", {}, `Hittade ${r.levels.length} ${r.levels.length === 1 ? "bana" : "banor"} och ${r.graphics.length} ${r.graphics.length === 1 ? "bild" : "bilder"}.`),
      r.levels.length ? el("p", { class: "muted" }, "Banor: " + r.levels.map(l => l.data.displayName || l.name).join(", ")) : null,
      replaced.length ? el("p", {}, "Det här ersätter dina nuvarande: " + replaced.join(", ")) : null,
      r.bad.length ? el("p", { class: "err" }, "Kunde inte läsa: " + r.bad.join(", ")) : null);
    UI.dialog("Importera", body, [["Avbryt"], ["Importera", async () => {
      for (const g of r.graphics) await saveGraphic(g);
      for (const l of r.levels) await saveLevel(l.name, l.data);
      storeChanged("levels"); storeChanged("graphics");
      if (ED.active) {
        const mine = r.levels.find(l => l.name === ED.name);
        ED.L = null;
        edOpen(mine ? ED.name : (r.levels[0] ? r.levels[0].name : ED.name));
      }
      UI.toast("Importerat!");
    }, "gold"]]);
  };
  document.body.appendChild(inp);
  inp.click();
}
